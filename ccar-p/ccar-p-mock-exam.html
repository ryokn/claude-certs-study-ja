<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-P 模擬試験（30問・日本語）</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--mute:#5b6678;--line:#dfe3ea;--acc:#c15f3c;--ok:#1f8a4c;--ng:#c0392b;--okbg:#e8f6ee;--ngbg:#fdecea;--sel:#fff3ec}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;max-width:880px;margin:0 auto}
h1{font-size:16px;margin:0}
.stat{font-size:13px;color:var(--mute)}
.stat b{color:var(--ink)}
.bar{height:4px;background:var(--line);max-width:880px;margin:6px auto 0;border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);width:0}
main{max-width:880px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.tag{display:inline-block;font-size:12px;background:#eef1f6;color:var(--mute);border-radius:999px;padding:2px 10px;margin-right:6px}
.tag.multi{background:#fff0e6;color:var(--acc);font-weight:600}
.stem{font-size:16px;margin:10px 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0;cursor:pointer;background:#fff}
.opt input{margin-top:5px;transform:scale(1.2)}
.opt.sel{background:var(--sel);border-color:var(--acc)}
.opt.correct{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--ngbg);border-color:var(--ng)}
.opt .lt{font-weight:700;min-width:1.2em}
.opt .note{display:block;font-size:13px;color:var(--mute);margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;cursor:pointer;min-height:42px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.res{border-radius:8px;padding:12px;margin-top:12px}
.res.ok{background:var(--okbg);border:1px solid var(--ok)}
.res.ng{background:var(--ngbg);border:1px solid var(--ng)}
.res h3{margin:0 0 6px;font-size:15px}
.src{font-size:12px;color:var(--mute);word-break:break-all}
.pal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.pal button{padding:6px 0;min-height:36px;font-size:13px}
.pal .c{background:var(--okbg);border-color:var(--ok)}
.pal .w{background:var(--ngbg);border-color:var(--ng)}
.pal .a{background:var(--sel);border-color:var(--acc)}
.pal .cur{outline:2px solid var(--ink)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:#f0f2f6}
.big{font-size:28px;font-weight:700}
.hide{display:none}
.legend{font-size:12px;color:var(--mute);margin-top:6px}
@media (max-width:560px){.pal{grid-template-columns:repeat(6,1fr)}.stem{font-size:15px}h1{font-size:15px}}
</style>
</head>
<body>
<header>
 <div class="hrow">
  <h1>CCAR-P 模擬試験</h1>
  <div class="stat">回答 <b id="sAns">0</b>/30 ・ 正解 <b id="sOk">0</b> ・ 経過 <b id="sTime">0:00</b>（目安 57:00）</div>
 </div>
 <div class="bar"><i id="pbar"></i></div>
</header>
<main>
 <section id="vQ" class="card">
  <div><span class="tag" id="qNo"></span><span class="tag" id="qDom"></span><span class="tag multi hide" id="qMulti"></span></div>
  <div class="stem" id="qStem"></div>
  <div id="qOpts"></div>
  <div class="btns">
   <button id="bPrev">← 前へ</button>
   <button id="bCheck" class="primary">答え合わせ</button>
   <button id="bNext">次へ →</button>
  </div>
  <div id="qRes" class="res hide"></div>
 </section>
 <section class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
   <b>問題一覧</b>
   <div class="btns" style="margin:0"><button id="bResult">結果を見る</button><button id="bReset">リセット</button></div>
  </div>
  <div class="pal" id="pal"></div>
  <div class="legend">緑=正解 / 赤=不正解 / 橙=選択中（未採点） ・ 進捗はこのブラウザ（localStorage）に自動保存されます</div>
 </section>
 <section id="vR" class="card hide">
  <h2 style="margin-top:0;font-size:18px">結果</h2>
  <div><span class="big" id="rScore"></span> <span id="rPct"></span></div>
  <p id="rMsg" style="margin:6px 0 12px"></p>
  <table><thead><tr><th>分野</th><th>正解/問題数</th><th>正答率</th></tr></thead><tbody id="rTbl"></tbody></table>
  <p style="font-size:12px;color:var(--mute)">目安：全体80%以上、各分野60%以上。本番のスケールスコア720は正答率72%を意味しません（要確認）。未回答の問題は不正解として集計します。</p>
  <div id="rWrong"></div>
 </section>
</main>
<script>
(function(){
"use strict";
var Q=[{"no": 1, "d": 3, "dn": "分野3 統合", "multi": false, "pick": 1, "stem": "社内ナレッジのエージェントに、GitHub・Jira・Slack・社内DBの5つのMCPサーバー、計45個のツール（読み取りと書き込みが混在）が常時接続されています。ツール定義だけで数万トークンを使い、無関係なツールを選ぶ割合も増えています。利用者の9割は検索と閲覧ですが、一部の運用担当は起票とコメントが必要です。最初に採る構成として最も適切なものはどれですか。", "opts": ["書き込みはエージェントからすべて外し、起票とコメントは夜間の一括処理に移す。閲覧だけをツール検索で必要時に読み、更新の即時性は捨てる。", "閲覧と更新で接続するツールを分ける。閲覧側からは書き込みを外し、共通の読み取りは残す。低頻度のツールはツール検索で、必要なときだけ定義を読む。", "閲覧用と更新用にエージェントを分ける。どちらにも45個を繋いだまま説明を要約して短くし、更新側だけ人の承認を必須にし、トークン削減を優先する。", "エージェントは一つにし、45個すべてをツール検索の対象に残す。書き込みの直前に確認を出し、定義の常時展開だけをやめ、権限の範囲は変えない。"], "notes": ["最小権限は、必要のない役割から外すことであり、必要な更新まで奪うことではない。", "最小権限は不要なツールを外すこと。役割分割と段階的ディスカバリーを同時に満たす。", "役割を分けても全員に全ツールが残る。要約は選択精度と権限のどちらも直さない。", "ツール検索はコンテキストを減らすが、閲覧役割に書き込みが残る。確認は補完的統制で、最小権限の代わりにならない。"], "ans": [1], "why": "機能の肥大化は、不要な権限・コンテキスト圧迫・ツール選択ミスが同時に起きた状態です。最初の対応は、役割に要るツールだけを残し（最小権限）、その残りのうち毎回は使わないものをツール検索で遅延読み込みすることです。確認ダイアログや説明の要約は、外せるツールを残したままでは根本になりません。一方で、運用担当の起票とコメントは要件なので、書き込みそのものを廃止するのも違います。", "src": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool"}, {"no": 2, "d": 3, "dn": "分野3 統合", "multi": false, "pick": 1, "stem": "社内MCPサーバーの設計レビューです。クライアントのアクセストークンは署名と有効期限を検証しています。そのトークンを下流の社内APIへ転送し、下流DBは全利用者共通のサービスアカウントで接続し、操作は監査ログに残しています。最も重大なギャップと対処はどれですか。", "opts": ["audienceがこのサーバーであることだけは確認する。確認したトークンはそのまま下流へ渡し、DBだけ利用者ごとのアカウントに切り替える。", "署名と期限に加え、audienceが下流APIであることを確認してから同じトークンを転送する。DBは共通アカウントのまま、ログに利用者IDを残す。", "他人宛てのトークンは拒否し、下流へは転送しない。実行はサーバー共通の強い権限で行い、ログの利用者IDだけを利用者単位の統制とみなす。", "サーバー宛てのトークンだけを受け入れる。下流には別途取ったトークンを使い、DBも利用者に紐づく権限で繋ぐ。共通アカウントは使わない。"], "notes": ["DBの分離は正しいが、受け入れたトークンの転送はパススルーのままで仕様違反。", "audienceの向け先が逆で、パススルーも共通アカウントも残る。ログは発見的統制。", "パススルーは止まるが、下流が過剰権限のままでは利用者ごとの認可にならない。ログは帰属であって権限ではない。", "トークンパススルーの禁止と、利用者単位の下流認可を両方満たす。"], "ans": [3], "why": "MCPの認可はOAuth 2.1がベースで、サーバーは自分宛て（audience）のトークンだけを受け入れます。受け取ったトークンを下流へ素通しするトークンパススルーは禁止で、下流には別のトークンを取ります。共通サービスアカウントは、利用者ごとの最小権限と監査を不可能にします。署名と期限の確認、監査ログ、利用者IDの記録は、このギャップを埋めません。", "src": "https://modelcontextprotocol.io/specification/2026-07-28/basic/authorization"}, {"no": 3, "d": 3, "dn": "分野3 統合", "multi": false, "pick": 1, "stem": "コールセンター向けのリアルタイム応答支援です。合意済みのSLAはp95で1.5秒以内、正答率の下限は90%です。現行の上位モデル・高effortは、同一の評価セットで正答率94%、p95は3.8秒です。難しい問い合わせは全体の約2割です。最も適切な判断はどれですか。", "opts": ["同一セットで、effortを下げた構成と小型モデルを比較する。SLAと90%を満たすなかで最も単純なものを採り、割る案件だけ上位へ振る場合も同じセットで見る。", "同一セットでモデルだけを一段階ずつ小さくし、effortは高のまま固定する。90%と1.5秒を同時に満たす段がなければ次の小型へ進み、effortは変えない。", "難しい2割を先に分類し、そこだけ現行構成、残りは小型モデルに固定する。分類器の精度は別途見るものとし、正答率の下限は現行の94%のままにする。", "同一セットで、現行モデルのキャッシュと出力上限だけを比較する。1.5秒に届かなければ、effortとモデルは維持したままSLAの見直しを先に提案する。"], "notes": ["同じ評価セットと合意済みSLAでトレードオフを測り、単純な構成から採る。", "評価の型は正しいが、モデルを替える前のレバーであるeffortを最初から放棄している。", "ルーティング自体は有効だが、分類器を含めた端到端を同じセットで見ておらず、合意より厳しい下限を勝手に置いている。", "下位の構成を測る前にSLAを開き直している。キャッシュは生成時間そのものをSLA内へ保証しない。"], "ans": [0], "why": "構成の根拠は、同じ評価セットの結果と合意済みSLAです。正答率の合意は90%なので、94%を守るためにレイテンシ違反を続ける理由にはなりません。モデルを替える前にeffortを調整する方が有効なことが多い、というのが公式のモデル選択の指針です。難しい案件だけ上位へ振るルーティングは、分類まで含めて同じセットで確認して初めて採れます。", "src": "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model"}, {"no": 4, "d": 3, "dn": "分野3 統合", "multi": false, "pick": 1, "stem": "社内チケットの参照と更新を、Claude Desktop、Claude Code、自社開発エージェントから、利用者ごとの権限で行いたいです。いまはクライアントごとに呼び出し方が違い、操作を足すたびに定義が食い違います。最も適切な統合メカニズムはどれですか。", "opts": ["各クライアントがチケットRESTを、利用者のOAuthトークンで直接呼ぶ。中間サーバーを挟まないのでレイテンシは短く、認可も利用者単位になる。", "チケット担当の自律エージェントを一つ立て、三つのクライアントはエージェント間の委譲でその担当に任せる。CRUDの手順は担当が毎回計画する。", "チケット操作をOAuth対応のリモートMCPサーバー（Streamable HTTP）として一つ実装し、三つのクライアントから同じサーバーへ接続する。", "チケット操作を共通CLIにし、利用者のOAuth資格情報で三環境から同じコマンドを呼ぶ。Codeのシェル実行を、Desktopと自社エージェントにも使う。"], "notes": ["認可の単位は正しいが、呼び出し定義がクライアントごとに残り、食い違いが再発する。単一アプリ内の決定的処理向け。", "実装は一箇所に集まるが、決定的なCRUDに自律的な計画が入り、遅延と非決定性が増える。", "複数クライアントで同じツール定義を再利用し、利用者単位の認可を標準化できる。", "CLIはシェルを持つエージェント向けで、Desktopと自社エージェントの共通のリモート接続にはならない。"], "ans": [2], "why": "MCPは、一つのサーバーを複数のクライアントから使うための標準です。リモートの標準トランスポートはStreamable HTTPで、認可はOAuth 2.1です。単一アプリの中だけならAPIの直接呼び出しで足りますが、今回の痛みはクライアントごとの定義の食い違いです。エージェント間の委譲は、自律的なタスクを渡すときに使い、決まったCRUDの提供には過剰です。", "src": "https://modelcontextprotocol.io/specification/2026-07-28/basic/transports"}, {"no": 5, "d": 3, "dn": "分野3 統合", "multi": false, "pick": 1, "stem": "契約書の検索で、ヒットした文書は合っているのに、引用した条項だけでは当事者と製品と参照先が特定できず、回答が誤ります。条項の長さはほぼ均一で、埋め込みモデルは変えていません。最も効果的な改善はどれですか。", "opts": ["チャンクを章単位まで粗くしてから、埋め込みとBM25を作り直す。定義は同じ章に含まれるはず、として条項単位には戻さず、他章の定義は落とす。", "条項の境界は維持する。各チャンクに文書全体から起こした短い文脈（当事者、製品、条項の位置）を前置し、その文字列で埋め込みとBM25をあわせて作り直す。", "索引は現状のまま、取得件数を増やし、リランカーに参照先を解決させてから順位を付けさせる。埋め込みとBM25は作り直さず、未取得の条項は残ったままになる。", "条項の境界は維持し、前後の条項との重なりを広げる。埋め込みとBM25は重なった本文だけで作り直し、文脈の前置はせず、定義は索引に残らない。"], "notes": ["単位を粗くすると近傍の文は入るが、冒頭の定義が別章だと解けず、検索単位もぼやける。", "Contextual Retrieval。索引そのものに、条項単体では失われる文書コンテキストを戻す。", "候補に入らなかった条項はリランカーも直せない。先に索引側の表現を直す。", "重なりは境界の取りこぼしには効くが、前文にない当事者や製品の定義は索引に入らない。"], "ans": [1], "why": "条項が「当該製品」「前項」のように単独で意味を持たないときは、チャンクに文書全体から起こした短い文脈を前置し、その文字列で埋め込みとBM25の両方を作り直します（Contextual Retrieval）。前後の重なりや章への粗大化は、文書全体の定義を索引に入れる代わりになりません。リランキングは、索引が正しい候補を返したあとの精度を上げる段です。", "src": "https://www.anthropic.com/news/contextual-retrieval"}, {"no": 6, "d": 3, "dn": "分野3 統合", "multi": true, "pick": 2, "stem": "製品サポートには二系統の問い合わせがあります。(1) 約300万トークンの仕様・手順で、エラーコードや型番の完全一致が多い。(2) 注文の今の配送状況と、倉庫の在庫数。状態は分単位で変わり、誤った在庫案内は補償の対象です。適切な方針を2つ選んでください。", "opts": ["在庫と配送も同じハイブリッド索引に入れる。15分ごとに取り込み直せば補償に足る鮮度になる、という判断で、都度の照会はしない。", "仕様と手順のハイブリッドは維持する。在庫と配送はAPIの結果を1時間ごとにチャンクへ書き戻し、検索で返す。都度の照会はしない。", "仕様と手順は語彙検索（BM25）と埋め込みのハイブリッドにする。識別子の完全一致を意味検索だけに任せず、両方の索引を持つ。", "仕様と手順は埋め込みに統一し、エラーコードは同義語辞書で展開してから探す。索引を一つにするためBM25は使わず、表記ゆれで補う。", "配送状況と在庫は索引に入れない。問い合わせのたびにAPIまたはツールでその時点の値を照会し、補償になる状態は都度取る。"], "notes": ["分単位で変わり補償対象の状態を、15分遅れの索引で返す設計になっている。", "APIを使っていても、返すのは時間遅れの写しである。ライブ状態を検索に担わせている。", "型番やエラーコードは埋め込みが取りこぼしやすい。語彙検索を併用する。", "同義語展開は完全一致の代替にならない。識別子には語彙検索が要る。", "ライブ状態は検索の役割ではない。照会のたびに取得する。"], "ans": [2, 4], "why": "データの形で戦略を分けます。静的で識別子が多い文書はBM25と埋め込みのハイブリッド、在庫や注文のようなライブ状態はツールやAPIでその都度取ります。取り込み間隔を短くしても、検索がライブ状態の役割を代替することにはなりません。知識ベースが約20万トークン未満なら全文をプロンプトに入れる選択もありますが、300万トークンには当てはまりません。", "src": "https://www.anthropic.com/news/contextual-retrieval"}, {"no": 7, "d": 1, "dn": "分野1 ソリューション設計とアーキテクチャ", "multi": false, "pick": 1, "stem": "保険会社の要望です。スキャンした請求書PDFから10項目を抽出し、基幹へ登録します。1日約5,000件、書式はおおむね一定ですが、汚れと手書きが一部にあります。夕方に締め、翌営業日の終業までに登録できればよく、1時間程度の待ちは許容されます。コストも成功基準で、低信頼分は人が訂正できます。最も適切なアーキテクチャはどれですか。", "opts": ["構造化出力、コード検証、低信頼の人手確認は同じにする。Batchは最大24時間なので終業に間に合わない可能性を見て、全件を同期APIで登録する。", "構造化出力で取った全件を、別モデルが項目ごとに批評して直してから登録する。人手確認は批評のあとにも残し、処理はBatchに載せ、全件を二段にする。", "構造化出力の単一呼び出しで抽出し、コードで検証する。低信頼だけ人が見る。即時性は不要なのでMessage Batches APIで処理し、同期の待ちは買わない。", "構造化出力を見出し・明細・合計のワーカーに分けて並列に取らせ、リードが結合してからコード検証する。低信頼は人が見て、処理はBatchに載せ、項目ごとに分割する。"], "notes": ["上限の24時間を通常の待ちと混同し、合意済みのコスト基準に対して不要な即時性を買っている。", "単一呼び出しと人手で足りるかを測る前に、全件へ評価者ループを足している。複雑さを先に買っている。", "最も単純な構成に、決定的な検証、必要な人の確認、SLAに合ったコスト最適化を重ねている。", "項目が固定の定型抽出に、事前に分割できない作業向けのオーケストレーションを使っている。"], "ans": [2], "why": "原則は、最も単純な解決で要件を満たし、必要なときだけ複雑にすることです。書式がほぼ一定の抽出は、構造化出力の単一呼び出し、コードによる検証、低信頼だけ人、で足ります。夕方締め・翌営業日終業・1時間程度の待ちが許容で、コストも成功基準なので、同期APIではなくMessage Batches APIが合います。Batchの多くは1時間以内で、24時間は上限です。", "src": "https://www.anthropic.com/engineering/building-effective-agents"}, {"no": 8, "d": 1, "dn": "分野1 ソリューション設計とアーキテクチャ", "multi": false, "pick": 1, "stem": "一つのプロンプトで、請求・技術サポート・解約を処理しています。請求向けに手順を足すと、技術サポートの品質が落ちます。カテゴリは明確で、分類の精度は既に高いです。最も適した構成はどれですか。", "opts": ["分類したあと、そのカテゴリ専用のプロンプトだけを実行する。モデルを変えるならカテゴリ単位でよい。共通にするのは分類と、カテゴリに依らない入出力の契約だけにする。", "一つのプロンプトのまま生成し、評価者が他カテゴリの手順を壊していないか批評して、不合格なら書き直すループにし、プロンプトは分けない方針で維持する。", "三つの専用プロンプトを毎回すべて実行し、評価者モデルが最も妥当な一つを選ぶ。分類器は使わず、選択は評価者に任せ、分類の精度は使わないままにする。", "分類したあと、全カテゴリの手順を含む共通プロンプトの末尾に、そのカテゴリの追記を足す。他方の退行は評価セットをゲートにし、落ちたら追記を戻して、共通本文は残す。"], "notes": ["分類が正確なとき、ルーティングでプロンプトを分離すると、片方の最適化が他方を壊さない。", "一つの依頼が全カテゴリを同時に満たす問題ではない。干渉は回答の反復では消えず、プロンプトの結合が原因である。", "専用プロンプトには分かれているが、正確に分類できるのに全経路を走らせ、選択を再度混ぜている。", "評価は退行を検知できるが、共通本文に全手順が残るので干渉の原因は消えない。"], "ans": [0], "why": "カテゴリが明確で分類が正確なのに、一つのプロンプトへの改善が他カテゴリを落とすときは、ルーティングで専用プロンプトへ分けます。共通プロンプトに追記する形は、退行テストを付けても本文の結合が残ります。全プロンプトを走らせて選ぶのは、同じタスクの信頼度を投票で上げるパターンであり、分類済みの振り分けではありません。", "src": "https://www.anthropic.com/engineering/building-effective-agents"}, {"no": 9, "d": 1, "dn": "分野1 ソリューション設計とアーキテクチャ", "multi": false, "pick": 1, "stem": "マルチエージェントはトークン消費が大きくなります。そのコストを最も正当化しやすいのは、どのケースですか。", "opts": ["章立てが固定の規制報告書を書く。各章は前章の用語と数値を参照する。章ごとにエージェントを割り当て、同時に書かせてから結合する。品質要件は高く、章は依存する。", "複数ファイルにまたがる障害修正を行う。ファイル間で同じ型と不変条件を共有し、ファイル単位の部分最適で結合部が壊れた実績がある。影響利用者は多く、同じ文脈が要る。", "決済障害の原因を、ログとデプロイとメトリクスから一つに決める。三つのエージェントへ同じ全証拠を渡し、投票で原因を確定する。被害額は大きく、証拠は共有する。", "40社の訴訟・規制・役員を、公開情報から会社ごとに独立して調べる。1社分でも単一のコンテキストに収まらず、見落としの損失が大きい。他社の途中結果には依存しない。"], "notes": ["章の間に依存がある。同時に書くと用語と数値が割れ、チェーンで渡すべき作業を並列にしている。", "部分最適で壊れた実績がある密結合な修正は、全員が同じ文脈を要る作業で、マルチエージェント向きではない。", "価値は高いが、全員が同じ全証拠を要る。共有コンテキスト上の投票であり、独立した探索ではない。", "価値が高く、並列で、コンテキストに収まらず、ワーカー間の依存が薄い。"], "ans": [3], "why": "マルチエージェントは、通常のチャットよりはるかに多くのトークンを使います。正当化しやすいのは、価値が高く、サブタスクが独立して並列にでき、単一のコンテキストに収まらない調査です。同じ証拠を全員が見る障害解析、前の成果に依存する報告書、共有の不変条件を壊しやすいコード修正は、価値が高くても条件を満たしません。", "src": "https://www.anthropic.com/engineering/multi-agent-research-system"}, {"no": 10, "d": 1, "dn": "分野1 ソリューション設計とアーキテクチャ", "multi": false, "pick": 1, "stem": "規制当局向けの報告書は20セクションあります。一括生成では、セクション間で用語がずれ、必須項目の抜けが安定しません。ルーブリックと必須見出しの一覧はあります。利用者は完成稿を手で直し、その差分は残っています。最も適切な分解はどれですか。", "opts": ["アウトラインは人が毎回書き、見出しの過不足も人が見る。その後のセクション生成とルーブリック批評は自動化し、修正差分は評価へ戻し、ゲートは人に残す。", "アウトラインを作り、必須見出しと用語表をコードでゲートする。通過分だけセクションごとに生成し、ルーブリックで批評して直す。利用者の修正差分は評価データへ戻す。", "20セクションを同時に生成するワーカーへ分け、共有の用語表は渡さず、リードが結合したあと全文をルーブリックで1回批評し、用語は結合時に揃え、章ごとのずれは残る。", "一括生成を維持し、ルーブリック評価者との書き直しを最大3回繰り返す。中間の見出しゲートは置かず、抜けは最終の反復で直し、全文を回し続けたままにする。"], "notes": ["必須見出しのような決定的な検査を毎回人に残し、コードでゲートできる段を外している。", "決定的な中間成果物をコードで止め、曖昧な品質は評価者に渡し、人の修正を評価へ戻している。", "依存する用語を共有しない並列化なので、結合後の1回の批評ではずれの原因が残る。", "評価者ループは妥当でも、分解せず全文を回すので、不安定さの原因である一括生成が残る。"], "ans": [1], "why": "手順に分解できる作業はプロンプトチェーンにし、決定的に検査できる中間成果物（必須見出し、用語表）はコードのゲートにします。セクションの品質のように基準が明確で反復できる部分は評価者-最適化者です。利用者の修正はフィードバックとして評価データへ戻します。全文の反復や、用語を共有しない並列生成は、この依存の形に合いません。", "src": "https://www.anthropic.com/engineering/building-effective-agents"}, {"no": 11, "d": 1, "dn": "分野1 ソリューション設計とアーキテクチャ", "multi": false, "pick": 1, "stem": "経営層から、コールセンター通話の要約について「結局何が良くなるのか」と問われました。現場の課題は後処理時間と1件コストで、品質を落とした時間短縮は受け入れないと分かっています。最も適切な提案はどれですか。", "opts": ["新しい洞察レポートと、1人あたり処理件数を主目標にし、後処理時間は現状維持でよいと置く。現状値と測り方は、その主目標について定義する。", "同じ4指標を使うが、自社の現状値は取らず、業界の上位四分位を目標にする。測り方は導入後に結果を見ながら決め、現状の実測は後回しにする。", "後処理時間、1件コスト、p95レイテンシ、事実誤りの率について、現状値・目標値・測り方をセットで合意する。時間短縮は品質の下限と一緒に置く。", "後処理時間だけを、現状値・目標値・測り方つきで合意する。コスト、レイテンシ、誤り率は技術側の内部指標とし、事業部の合意には含めないままにする。"], "notes": ["測定の型は正しいが、問われている課題とは別の柱へ目標を載せ替えている。", "指標の名前は合っているが、自社のベースラインと測り方が合意されていない。外部の四分位は現状値の代わりにならない。", "課題に対応する価値の柱を、ベースライン・目標・測定方法に落としている。", "効率性だけでは、コストと品質を犠牲にした時間短縮を合意が止められない。柱が欠けている。"], "ans": [2], "why": "価値の柱は、効率性、変革、生産性、コスト、パフォーマンスSLAです。問われている後処理とコストに対しては、品質の下限とレイテンシを含めて、現状値・目標値・測り方をセットで合意します。業界ベンチマークや、別の魅力的な柱へすり替える説明は、この課題の合意になりません。", "src": "試験ガイド 分野1"}, {"no": 12, "d": 4, "dn": "分野4 評価、テスト、最適化", "multi": false, "pick": 1, "stem": "医療機関向けの退院サマリー要約について、成功基準を定義します。最も適切なものはどれですか。", "opts": ["原文と矛盾する重大な事実誤りの率、必須項目の網羅率、不適切な助言の割合、p95レイテンシ、1件コストに、それぞれ数値の目標を決めておく。", "事実誤り、網羅、不適切な助言、p95、1件コストを観点として列挙する。目標の数値はベースライン計測のあとで決めるので、今回は名前だけ合意する。", "BLEU、p95、1件コスト、毒性分類器のヒット率に数値目標を付ける。原文との矛盾と必須項目の抜けは、この基準には含めず代理指標で見る。", "事実誤りの率、網羅率、p95、1件コストには数値目標を付ける。不適切な助言だけは「出さない」という方針文とし、率では持たず目標値にしない。"], "notes": ["タスクに関係する観点が具体的で、測定でき、ゲートに使える。", "観点は正しいが、目標値がなく、変更の合否を判定する基準として閉じない。", "数値にはなっているが、要約が守るべき事実と網羅を、表面一致と汎用の毒性スコアで代用している。", "安全性だけが測定不能のまま残る。曖昧な方針は成功基準にならない。"], "ans": [0], "why": "良い成功基準は、具体的で、測定でき、達成可能で、そのタスクに関係するものです。安全性のような曖昧な観点も「不適切な助言の割合が一定未満」のように率にします。表面的な一致や汎用の毒性スコアは、原文との矛盾や必須項目の抜けを置き換えません。観点の名前だけでは、リリースのゲートになりません。", "src": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"}, {"no": 13, "d": 4, "dn": "分野4 評価、テスト、最適化", "multi": true, "pick": 2, "stem": "返金条件を案内し、条件を満たすときだけ返金ツールを呼ぶサポートエージェントの、評価セットと採点を設計します。件数は今後数千件まで増やし、プロンプトやモデルを変えるたびに回します。適切な方針を2つ選んでください。", "opts": ["コード採点と人手で較正したLLM採点を使い、実行後の状態も見る。合格を決めるセットは典型例だけにし、エッジは探索用として外に置く。", "本番の入力分布に加え、空に近い入力、極端に長い入力、敵対的な入力、人でも判断が割れる境界の事例を、合格を決めるセットに含め、端も残す。", "エッジケースを含めたセットにする。採点は最初からLLMのルーブリックに任せ、人が見るのは低自信のケースだけにし、事前の較正はまだしない。", "金額とツール引数の一致はコードで採点する。説明の妥当性は人手で較正したLLMに任せ、返金の成否は実行後の状態で見て、拡大前に合わせる。", "エッジケースを含めたセットにする。金額の一致も含め、品質を優先して全件を人手で採点し、LLMによる採点は本線では使わず人に残す。"], "notes": ["採点方式は正しいが、エッジを合格ゲートの外へ出しており、量を優先してタスク固有の難しさを捨てている。", "タスク固有のセットにし、エッジケースを本線の合格条件に含める。", "分布は良いが、採点者を人手と突き合わせる前に拡大している。低自信は較正の代わりにならない。", "決定的な検査はコード、ニュアンスは較正済みのLLM。エージェントは最終状態も採点する。", "人手は最も柔軟だが、毎回数千件を回す本線の採点にはスケールしない。コードで足りる検査まで人に渡している。"], "ans": [1, 3], "why": "評価セットは本番分布とエッジを含めてタスク固有にします。採点は、コードで決まるもの、較正したLLM、人の順に検討し、人はLLM採点の確認と難しいケースに使います。エージェントでは、最終の発話だけでなく、ツール実行後の状態（返金が実際に存在するか）を見ます。「質より量」はエッジを捨てる意味ではありません。", "src": "https://platform.claude.com/docs/en/test-and-evaluate/develop-tests"}, {"no": 14, "d": 4, "dn": "分野4 評価、テスト、最適化", "multi": false, "pick": 1, "stem": "新しいプロンプトのA/Bテストを、週末を含む2日間行いました。事前に登録した主指標の解決率は1.2ポイント上がりましたが、サンプル数は必要数の3分の1、p値は0.2です。副次の1件コストは下がり、そのp値は0.03です。安全性とレイテンシのガードレールは動いていません。最も適切な判断はどれですか。", "opts": ["テストは延長するが、必要数に達する前でも、主指標のp値が0.05を下回った日に全面へ出す。仮説が事前のままなら、サンプル数は目安だという判断である。", "p値が0.2なので効果なしと結論し、テストを止めて流量を戻す。週末分が弱かったことも、主指標が動かないことの裏付けにし、延長はしない。", "主指標は未了だが、コストは有意に下がりガードレールは無事なので、コストを根拠に全面へ出す。解決率は方向性として併記し、主指標は待つ。", "事前の仮説・主指標・必要サンプル数を維持して、必要数まで続ける。コスト低下は副次の観察として記録し、今は効果があったともなかったとも言わない。"], "notes": ["仮説は固定でも、有意になるまで見るのは任意停止で、事前のサンプル数を無効にする。", "必要数の3分の1では、効果がないとは言えない。週末の切片を主結果の根拠にするのも早い。", "有意だった副次指標へ決定の根拠を載せ替えている。ガードレールが無事なことは、主指標の成立を意味しない。", "事前登録を守り、検出力不足の結果をどちら向きにも主張しない。"], "ans": [3], "why": "A/Bテストでは、仮説、主指標、ガードレール（安全性、コスト、レイテンシ）、必要なサンプル数、期間を事前に決めます。必要数に達する前の1.2ポイントは、勝ちでも負けでもありません。有意だった副次指標へ判断を乗り換えることと、p値が0.05を割った時点で止めることは、どちらも事前の計画を崩します。週末を含む短い期間にも注意します。", "src": "https://anthropic-partners.skilljar.com/path/claude-certified-architect-professional/enterprise-integration-production"}, {"no": 15, "d": 4, "dn": "分野4 評価、テスト、最適化", "multi": false, "pick": 1, "stem": "本番のモデル指定はエイリアスでした。参照先のスナップショットが切り替わった直後から、JSONの崩れと冗長な出力が増えました。プロンプトも、検索対象の文書も、バージョンは固定のまま変わっていません。最初に取るべき対応として最も適切なものはどれですか。", "opts": ["直前のスナップショットへ戻したうえで、移行ガイドのプロンプト修正を数例の机上確認で採用する。回帰評価スイートを回すのは次の定期リリースにする。", "直前のスナップショットに固定して影響を止める。新スナップショットは回帰評価の合格後に、移行ガイドと必要な構造化出力で載せ、中身の退行まで見る。", "新しいエイリアスのまま、形式を強める文言を足して数件で確認する。スナップショットは戻さず、回帰評価は文言の修正が一段落してから回し、本番は止めない。", "崩れがJSONなので、新しいエイリアスのまま構造化出力へ切り替える。形式が保証されれば、スナップショットの固定と回帰評価は次のリリースでよい。"], "notes": ["固定で影響は止まるが、数例の確認を回帰評価の代わりにして、新しいモデルをゲートなしで採っている。", "変わったもの（モデル）を止め、評価を移行のゲートにする。", "変わったスナップショットを本番に残したまま、数件の文言修正で原因に手を付けている。", "構造化出力は形式の保証にはなるが、冗長さや中身の退行を止めない。影響が続いたまま次のリリースまで測らない。"], "ans": [1], "why": "何が変わったかから切り分けます。プロンプトと文書は変わっておらず、エイリアスの向き先だけが変わったので、まずモデルの不適合です。本番はスナップショットに固定して影響を止め、新しいモデルは回帰評価を通過してから、移行ガイドと構造化出力で載せます。形式だけを先に保証しても、冗長さや中身の退行は残り、数例の確認はスイートの代わりになりません。", "src": "https://platform.claude.com/docs/en/about-claude/models/overview"}, {"no": 16, "d": 4, "dn": "分野4 評価、テスト、最適化", "multi": false, "pick": 1, "stem": "月に数百万件の多段サポートエージェントが、ときどき誤った返金条件を案内します。原因を特定し、再発を検知するモニタリングとして最も適切なものはどれですか。", "opts": ["ツール結果とチャンクを含むトレースを取り、個人情報は伏せて期限を切る。アラートは低評価の押下と5xxにし、ルーブリック評価は月次の人手サンプルだけに限る。", "同じ段のトレースと返金ルーブリックのアラートを取る。調査のため会話の原文は期限を切らず平文で残し、過去の返金を全文検索できるようにし、保存の期限は設けない。", "トレースIDでLLM呼び出し、ツール入出力、検索チャンク、モデルとプロンプトの版を相関させる。返金ルーブリックをサンプル評価し、個人情報は伏せて期限を切る。", "モデル版とトークンとレイテンシをトレースし、最終回答だけのルーブリックを取る。ツール結果と検索チャンクは記録せず、アラートは5xxと最終スコアにする。"], "notes": ["トレースはあっても、検知が利用者の申告と月次に寄っており、気づかれない誤案内の再発を待てない。", "観測項目は足りるが、個人情報の最小化と保存期限を外している。調査のしやすさは無期限の原文保存を正当化しない。", "無言の誤答を段ごとに追えて、再発をルーブリックで検知し、保存も最小化している。", "最終回答のスコアでは、誤った条件が検索・ツール・プロンプトのどこから来たかが残らない。5xxは正常応答の誤答を見ない。"], "ans": [2], "why": "この種の不具合の多くは、HTTP 200で返る誤答です。段ごとのトレース（ツール結果、検索チャンク、モデルとプロンプトの版）がないと原因の段が分かりません。再発の検知は、本番サンプルへのオンライン評価とアラートです。ログは個人情報を伏せ、保存期限を切ります。低評価ボタンや月次の人手は、補助であって本線の検知ではありません。", "src": "https://code.claude.com/docs/en/monitoring-usage"}, {"no": 17, "d": 5, "dn": "分野5 ガバナンス、安全性、リスク管理", "multi": false, "pick": 1, "stem": "外部から届いたメールを読み、返信の下書きを作り、送信ツールで送れるエージェントがあります。メール経由の間接プロンプトインジェクションを防ぐ構成として、最も適切なものはどれですか。", "opts": ["メールは出所を明示したツール結果として渡す。出力は軽量モデルで検査し、送信はアプリ側の認可と人の承認を必須にする。持ち出しに使えるツールは役割から外す。", "メールは出所を明示したツール結果として渡し、出力も軽量モデルで検査する。人の承認は、検査がインジェクションと判定した送信だけに付け、残りは送る。", "出所の明示、出力の検査、送信前の人の承認、ツールの最小化は同じにする。ただしメール本文はシステムプロンプトへ埋め、方針と本文を隣り合わせて境界を明確にする。", "メールはツール結果で渡し、出力を検査し、送信には人の承認を必須にする。利用者の保管用に、指定URLへメールをコピーするツールだけは承認の対象外として残す。"], "notes": ["信頼できない入力の境界、検査、不可逆な操作の強制、最小権限が揃っている。", "検査の見逃しが、そのまま外部送信になる。不可逆な操作を検知の成否に掛けている。", "承認はあっても、信頼できない本文をシステム側の指示チャネルへ入れており、データと指示の境界が消える。", "送信だけを止めても、承認のないコピーツールが持ち出し経路として残る。最小権限が抜けている。"], "ans": [0], "why": "間接インジェクションでは、メールのような信頼できない内容をツール結果として渡し、出所を明示します。ただしモデルや検査の見逃しは残るので、送信のような不可逆な操作はアプリ側の認可と人の承認で強制し、持ち出しに使えるツールは外します。本文をシステムプロンプトへ入れることと、検査に引っかかったときだけ承認することは、どちらも強制の位置が違います。", "src": "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks"}, {"no": 18, "d": 5, "dn": "分野5 ガバナンス、安全性、リスク管理", "multi": false, "pick": 1, "stem": "入力スクリーニングの分類器が、ピーク時にタイムアウトし始めました。読み取り中心の業務はピークでも継続する合意があり、送金と外部送信は止めてよいことになっています。障害時の挙動として最も適切な設計はどれですか。", "opts": ["読み取りを含む全操作を、分類器が回復するまで拒否する。縮退はせず、再試行は上限付き、障害はアラートする。継続の合意より安全側へ倒し、読み取りより停止を優先する。", "送信は一度キューに入れ、分類器の回復後に人を介さず自動で実行する。読み取りは縮退し、再試行は上限付き、障害はアラートし、保留の解放は人を介さず自動にする。", "分類器がタイムアウトした送信は、より小さいキーワード検査を通せば実行する。読み取りは限定して続け、再試行は上限付き、障害はアラートし、弱い検査で通す。", "送金と外部送信は拒否・保留・人へのエスカレーションで止める。読み取りは機能を限定して続ける。分類器への再試行は上限を切り、ブレーカーと障害アラートを付ける。"], "notes": ["高リスクを止める点は正しいが、合意済みの読み取り継続まで落としており、リスクの切り分けがない。", "保留に見えて、解放が自動である。回復時の一斉実行になり、人の判断を通らない。", "落ちた安全管理の代わりに、より弱い検査で高リスクを通している。フェイルオープンに近い。", "高リスクはフェイルクローズ、低リスクは合意どおり縮退。再試行は有界。"], "ans": [3], "why": "安全管理策が落ちたときに、その策が守っていた高リスクの操作を通してはいけません。拒否、保留、人へのエスカレーションで止めます。合意がある低リスクの読み取りは、機能を限定した縮退で続けます。再試行は上限を切り、サーキットブレーカーとアラートを付けます。より弱い検査へのフォールバックや、回復後の自動実行は、止まっていません。", "src": "https://anthropic-partners.skilljar.com/path/claude-certified-architect-professional/responsible-ai-safety-risk-for-architects"}, {"no": 19, "d": 5, "dn": "分野5 ガバナンス、安全性、リスク管理", "multi": false, "pick": 1, "stem": "融資審査を補助するシステムです。否決の通知はこのシステムから申請者へ直接送り、一度送ると撤回が難しいです。承認の推薦は、資金実行の前段にある別システムの二重承認で取り消せます。追加資料の依頼は影響が小さいです。全件を人が見ると確認が形骸化することが、パイロットで分かっています。レビューをどこに置くのが最も適切ですか。", "opts": ["高信頼の否決と承認は自動で送り、閾値未満だけ人が見る。自動分の5%はサンプル監査する。属性ごとの結果差は定期的に見て、否決も信頼度で分ける。", "否決通知の前は必ず人が見る。高信頼で可逆な承認推薦は自動で段取りし、サンプル監査する。低信頼は人の列へ入れる。属性ごとの結果差は定期的に見る。", "否決も承認も、信頼度にかかわらず人が全件を見るように担当を増やす。追加資料の依頼だけ自動化する。属性ごとの結果差は四半期に見て、人員で全件を賄う。", "承認の推薦は資金が動くので必ず人が見る。高信頼の否決は金が動かないので自動で通知する。低信頼は人へ回し、属性ごとの差も定期的に見る。"], "notes": ["信頼度と監査と公平性はあるが、否決通知の不可逆性を見ていない。自信のある誤った否決がそのまま届く。", "可逆性・誤りのコスト・信頼度で人を配り、全体精度では見えない差も見る。", "公平性の確認はあるが、可逆で高信頼な承認まで同じ強度にしており、パイロットで見えた形骸化を人員で押し返している。", "公平性の確認はあるが、害の向きが逆である。不可逆なのは否決通知で、承認推薦は後段で取り消せる。"], "ans": [1], "why": "人のレビューは、信頼度、可逆性、誤ったときのコストで振り分けます。撤回が難しい否決通知は必ず人が見ます。後段で取り消せる高信頼の承認は自動化し、サンプルで監査します。低信頼は人へ回します。全体の精度が高くても属性ごとに差が出ることがあるので、その差も定期的に見ます。全件を人にすると確認が形骸化し、信頼度だけ・資金が動くかどうかだけでは軸が足りません。", "src": "https://anthropic-partners.skilljar.com/path/claude-certified-architect-professional/responsible-ai-safety-risk-for-architects"}, {"no": 20, "d": 5, "dn": "分野5 ガバナンス、安全性、リスク管理", "multi": true, "pick": 2, "stem": "米国の連邦機関向けに、FedRAMP Highが必須の独自アプリを作ります。推論APIとして使える提供経路を2つ選んでください。", "opts": ["AWS GovCloud（US）上の Amazon Bedrock 経由でClaudeを呼ぶ。Highの境界は、このGovCloud上のBedrockという提供形態である。", "AWS GovCloud（US）に置いたプロキシから、Anthropic直接のClaude APIを呼ぶ。置いた先がGovCloudなら、Highの境界だけに入る、という判断である。", "商業リージョンの Vertex AI を使う。Assured Workloads はデータの所在の仕組みであり、FedRAMP Highの提供経路ではない、という判断である。", "Assured Workloads を有効にした Google Cloud の Vertex AI 経由でClaudeを呼ぶ。Highの境界は、この制御を付けたVertexである。"], "notes": ["案内されているHighの経路。境界はGovCloud上のBedrockという提供形態。", "GovCloudという語はあるが、推論の提供元はHighの対象として案内されていない直接APIのまま。プロキシの置き場所は認可境界を移さない。", "Assured Workloadsを外したVertexは、案内されているHighの経路ではない。所在の仕組みだとして境界を落とすのが誤り。", "案内されているHighの経路。Assured Workloads付きのVertex AI。"], "ans": [0, 3], "why": "コンプライアンス要件は、他のトレードオフより先に提供経路を絞ります。公式の政府向け案内でFedRAMP Highなのは、Claude for Government、AWS GovCloudのBedrock、Assured WorkloadsのVertex AIです。独自アプリの推論APIとして採れるのは、後の二つです。GovCloudにプロキシを置いても、直接のClaude APIがその境界に入るわけではありません。商業リージョンのVertexは、Assured Workloads付きの経路とは別です。モデル単位の状況は変わることがあるため要確認です。", "src": "https://claude.com/solutions/government"}, {"no": 21, "d": 6, "dn": "分野6 ステークホルダーとのコミュニケーションとライフサイクル管理", "multi": false, "pick": 1, "stem": "技術に詳しくない事業部長から「AIでカスタマーサポートを自動化したい」と相談されました。アーキテクトが最初に行うこととして、最も適切なものはどれですか。", "opts": ["件数が最も多いチケットで薄い試作を先に動かし、デモへの反応を見てから成功の判定と制約を文書にする。その反応が要件の代わりになる、という進め方で進める。", "ワークショップでモデルの段、コンテキストの置き方、検索とファインチューニングの得失を比べ、週末までに事業部長が採用する構成を一つ選んでもらい、技術の選定を先に終える。", "現行の手順、件数、KPIの現状値、成功の判定、規制とデータと既存システムの制約、関係者、人へのエスカレーションを聞き、前提として文書にする。構成はまだ選ばない。", "件数とKPIの現状値を先に文書化する。規制、データの所在、エスカレーションは設計工程に入ってから改めて確認すれば足りるので、最初の聞き取りでは扱わない。"], "notes": ["試作は問いに答える道具であり、成功基準と制約がないままでは何を証明したかが残らない。", "対話の形はディスカバリーでも、中身は要件が決まる前の技術選定になっている。", "設計がビジネスケースへ遡れるよう、要件と前提を先に固定する。", "現状値は正しい開始だが、経路を絞る制約と人の介在を後回しにすると、設計の前提が欠ける。"], "ans": [2], "why": "最初に行うのは、非技術の相手との体系的なディスカバリーです。現行業務、量、成功基準と現状値、制約、関係者、エスカレーションを聞き、アーキテクチャ要件と前提として文書にします。モデルや検索の選定、制約を後回しにした試作は、その文書のあとで問いに答えるために使います。", "src": "https://anthropic-partners.skilljar.com/path/claude-certified-architect-professional/stakeholder-engagement-lifecycle-gtm"}, {"no": 22, "d": 6, "dn": "分野6 ステークホルダーとのコミュニケーションとライフサイクル管理", "multi": false, "pick": 1, "stem": "経営層と調達に、Claudeの提供経路（直接のAPIか、Amazon Bedrockか）を説明します。意思決定につながりやすい説明はどれですか。", "opts": ["それぞれの経路を、コスト、コンプライアンスとデータの所在を含むリスク、後から乗り換える作業とセットで示し、推奨と、その推奨が依存する前提を明記して示す。", "Bedrockを推奨し、そのコストとコンプライアンスは示す。直接APIは注記で「非推奨」とだけ書き、乗り換える場合の作業は、決まったあとの詳細設計に回す。", "コスト、乗り換えの作業、推奨と前提は経路ごとに示す。リスクの行はレイテンシとSDKの成熟度に限り、コンプライアンスと所在は後段のセキュリティ審査へ送る。", "コスト、リスク、乗り換えの作業を経路ごとに同じ表へ並べる。アーキテクトとしての推奨も前提も書かず、調達が中立に選べるよう、結論はこの場の受け手へ残す。"], "notes": ["判断する相手に、コスト・リスク・可逆性と推奨を同じ表で渡している。", "推奨はあるが、比較する側の中身と、後から変えるコストが意思決定の場にない。", "表の形と推奨はあるが、この聞き手の決定に必要なリスク（コンプライアンスと所在）が表にない。", "材料は揃っているが、アーキテクトの推奨と前提がなく、レビューが止まりやすい。"], "ans": [0], "why": "経営層と調達には、各選択肢をコスト、リスク（コンプライアンスとデータの所在を含む）、後から変える作業とセットで示し、推奨とその前提を書きます。材料だけの中立、推奨だけの一点、技術リスクだけの表は、この場の決定に必要な比較になりません。", "src": "https://anthropic-partners.skilljar.com/path/claude-certified-architect-professional/stakeholder-engagement-lifecycle-gtm"}, {"no": 23, "d": 6, "dn": "分野6 ステークホルダーとのコミュニケーションとライフサイクル管理", "multi": false, "pick": 1, "stem": "本番のあと、合意済みのSLA（p95レイテンシ）の違反が3日続いています。違反時の手順は、通知、原因分析、是正の計画と期限、そして調整で直るか再設計かを分けることまで、事前に合意してあります。最も適切な対応はどれですか。", "opts": ["effort、キャッシュ、振り分けの調整を先に試し、違反が残ったときだけ通知する。直るかもしれない段階で知らせると、不要な不安を招く、という判断である。", "ダッシュボードとともに直ちに通知し、観測されたp95へSLAを緩め直す是正として提案する。原因の切り分けは、数値を合意し直した次の四半期に行う。", "直ちに通知し、是正計画として複数リージョンとモデル変更と検索の再設計を、原因の切り分けより先に確定して期限を切り、再設計の方を先に決める。", "合意した手順どおりに通知し、原因を分けたうえで是正の計画と期限を共有する。設定の調整で戻るか、構成の見直しが要るかを、原因に基づいて選ぶ。"], "notes": ["調整自体は反復としてあり得るが、合意した通知を結果が出るまで止めている。", "通知は早いが、原因の前に目標の方を動かしており、合意した分析と是正の順が逆である。", "通知と期限はあるが、調整で足りるかを見る前に再設計を確定している。", "事前の手順を守り、反復と再設計の選択を原因のあとに置いている。"], "ans": [3], "why": "SLA違反では、事前に合意した手順（通知、原因分析、是正の計画と期限）に従います。設定の調整で戻るのか、構成を見直すのかは、原因を見てから選びます。目標値だけを先に緩めること、直してから知らせること、原因の前に再設計を確定することは、この手順のどこかを飛ばしています。", "src": "https://anthropic-partners.skilljar.com/path/claude-certified-architect-professional/stakeholder-engagement-lifecycle-gtm"}, {"no": 24, "d": 6, "dn": "分野6 ステークホルダーとのコミュニケーションとライフサイクル管理", "multi": false, "pick": 1, "stem": "アーキテクトが離れたあとも、顧客チームが本番を運用し、モデルやプロンプトの変更を自分たちで判定できるようにしたいです。引き継ぎとして最も適切なものはどれですか。", "opts": ["決定記録、手順書、評価スイート、ダッシュボード、担当、リリース手順を一式渡す。合格はレビューアの判断、閾値は「異常なら通知」、担当は基盤チームの一括とする。", "決定・代替案・理由・前提を書いた決定記録、手順書、合格基準つきの評価スイート、閾値のあるダッシュボード、部品ごとの担当、変更とリリースの手順をまとめて渡す。", "代替案まで書いた決定記録、合格基準つきの評価スイート、信頼境界の図を渡す。手順書とアラートの閾値と当番は、ハイパーケアの間にチームが書く、という分担にする。", "代替案と理由まで書いた決定記録、手順書、閾値のあるダッシュボード、担当、リリース手順を渡す。評価はプロンプトがリポジトリにあるので、スイートとしては渡さない。"], "notes": ["名前は揃っているが、合格基準も閾値も担当も実行できる形になっておらず、不在後に判定できない。", "理由が残り、障害時に動け、変更の合否をチームが自分で判定できる。", "設計の判断と評価は残るが、不在の当夜に使う運用の手順と閾値と担当がまだない。", "運用の成果物は揃うが、モデルやプロンプトの変更を判定する合格ゲートがチームに残らない。"], "ans": [1], "why": "引き継ぎは、アーキテクトがいないまま運用と改善が続くように作ります。決定記録には代替案・理由・前提を残し、手順書と閾値と担当で当夜を回し、合格基準つきの評価スイートを、以後のモデルとプロンプトの変更のゲートにします。名前だけの成果物や、運用を後で書く約束では、不在後に機能しません。", "src": "https://anthropic-partners.skilljar.com/path/claude-certified-architect-professional"}, {"no": 25, "d": 2, "dn": "分野2 Claudeモデル、プロンプト作成、コンテキストエンジニアリング", "multi": false, "pick": 1, "stem": "問い合わせの分類と振り分けを、毎秒数百件、低いレイテンシで処理します。ラベルは安定し、評価セットは既にあり、できるかどうかの不確実性は小さいです。誤分類のコストは限定的で、p95と単価が制約です。モデル選択の進め方として最も適切なものはどれですか。", "opts": ["コンテキストが最大のティアを選び、多数の問い合わせを1回の呼び出しにまとめて単価を下げる。精度はそのまとめた形のセットで測り、窓の長さで選び、まとめ呼びを優先する。", "最上位のティアから始め、SLAと精度を満たすことを確認してから、ティアとeffortを下げる。不確実性が小さくても、上限を先に固定すべきだという判断である。", "最も小さく速いティアから、同じ評価セットで精度を見る。基準に届かないときだけ、effortを上げるか、一段階上のティアを同じセットで試し、小さい側から上げる。", "小さいティアを使うが、プロンプトでのベースラインを測る前に、ラベルでファインチューニングし、そのモデルだけを評価セットにかける。件数が多いので学習を先にする。"], "notes": ["短い分類の選択軸はコンテキスト長ではない。まとめ呼びは誤りと遅延の尾を結合させる。", "能力優先は、達成できるかが未知の難しい作業向け。この制約では、最初の1件から最高段の遅延と単価を払う。", "大量・低遅延・単純・不確実性が小さいときは、効率優先で小さい側から上げる。", "段の方向は効率側でも、ベースラインを見る前の学習は、評価より先に高コストな手段を選んでいる。"], "ans": [2], "why": "モデル選択には、小さい側から上げる効率優先と、上位から下げていく能力優先があります。大量で、低レイテンシで、単純で、達成可否の不確実性が小さい分類は効率優先です。基準に届かないときだけeffortを上げるか、一段上を同じ評価セットで試します。ファインチューニングやコンテキスト長は、この選択の最初の軸ではありません。", "src": "https://platform.claude.com/docs/en/about-claude/models/choosing-a-model"}, {"no": 26, "d": 2, "dn": "分野2 Claudeモデル、プロンプト作成、コンテキストエンジニアリング", "multi": false, "pick": 1, "stem": "請求書からの項目抽出で、出力がJSONになったりならなかったりし、下流の解析が失敗します。本番のモデルはClaude 4.6以降の世代です。最も確実な対策はどれですか。", "opts": ["スキーマをoutput_config.formatで指定するか、ツール入力でstrictを有効にする。典型と境界の例を少数添え、準拠はデコーディング側で保証する。", "ツールに入力スキーマは渡すが、strictは付けない。解析に失敗した応答だけ同じ呼び出しを最大3回やり直し、通ったものを採用して保証の代わりにする。", "正しいJSONの例を少数添え、temperatureを0にしてゆらぎを消す。スキーマによる制約付きデコーディングは使わず、例と低温で形式を揃えるだけで保証はしない。", "アシスタントの先頭を開き括弧でプレフィルし、続けてスキーマどおりに書かせる。例は少数添え、開始記号を固定すれば解析の失敗は止まる、という判断である。"], "notes": ["制約付きデコーディングがスキーマ準拠を保証する。例は形式の補助であり、保証そのものではない。", "失敗のやり直しは確率の改善で、必須項目の欠落が残る。strictやスキーマ指定のような保証ではない。", "例と低温はゆらぎを減らすが、解析できることを保証しない。下流の失敗モードが残る。", "開始記号はスキーマ全体を保証しない。4.6以降のモデルではプレフィル自体が使えない。"], "ans": [0], "why": "構造化出力（output_config.formatのJSONスキーマ、またはツール入力のstrict）は、制約付きデコーディングでスキーマに沿った応答を保証します。例やtemperature 0や失敗時のやり直しは、その確率を上げるだけで保証ではありません。アシスタント先頭のプレフィルは、4.6以降のモデルではサポートされていません。", "src": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs"}, {"no": 27, "d": 2, "dn": "分野2 Claudeモデル、プロンプト作成、コンテキストエンジニアリング", "multi": false, "pick": 1, "stem": "複数の条件を組み合わせる保険の適用判定で、境界の事例の誤りが目立ちます。判定は同期ですが、数秒のSLAで、思考の追加は許容されます。誤りのコストの方が大きいです。プロンプトの手法として最も適切なものはどれですか。", "opts": ["thinkingを高いeffortで有効にする。例は最も多い承認パターンに似たものを20件並べ、その型に寄せてばらつきを減らし、境界の例は足さない。", "境界を含む多様な例の結論だけを少数示し、推論の過程は書かせない。レイテンシを優先してeffortは低のままにし、思考は足さず、過程も書かせない。", "思考の連鎖を指示するが、結論を先に1語で出させ、理由はその後の短い1文だけにする。冗長な推論でSLAを超えないよう、順序は結論を先にし、理由は後ろに置く。", "結論の前に段階的に推論させる。thinkingを使うならeffortはSLAの範囲で調整し、推論と結論はタグで分ける。例は境界を含む多様なものにする。"], "notes": ["推論のレバーは使っているが、例が一つの型に偏り、その表面へ過剰に合わせる。", "例の多様性は正しいが、複数条件の判定で推論を省いており、SLAが思考を許すのに低effortのまま固定している。", "結論が推論より先では、段階的な推論にならない。長さはタグとスキーマで抑え、順序は結論を後ろにする。", "多段の判定には結論の前の推論と、多様な境界例が要る。"], "ans": [3], "why": "複数の条件を踏む判定では、結論の前に推論させます。thinkingを使うならeffortはSLAの中で調整し、推論と結論はタグで分けます。few-shotは、最も多い型の繰り返しではなく、境界を含む多様な例にします。結論を先に短く出させるのは、推論の順序が逆です。", "src": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview"}, {"no": 28, "d": 2, "dn": "分野2 Claudeモデル、プロンプト作成、コンテキストエンジニアリング", "multi": false, "pick": 1, "stem": "社内アシスタントのシステムプロンプトに、業務手順が20種類、各約3,000トークン入っており、毎回約6万トークンを使います。1回の会話で使うのは、たいてい1〜2種類です。途中の段落だけ守ると事故になるため、使うときは全文と付随するスクリプトをまとめて載せる必要があります。最も適切な構成はどれですか。", "opts": ["共通の方針だけを先頭に置いてキャッシュし、手順は検索で当たったチャンクを足す。全文を一度に載せず、当たった段落から順に実行させ、手順は分割する。", "手順をスキルに分ける。常時読むのは名前と説明だけにし、該当する依頼のときだけ本文とスクリプトを読む。変わらない共通部分は先頭に置いてキャッシュする。", "名前と説明だけを常時読み、本文とスクリプトは該当する依頼のときだけ読む。名前と説明は利用者メッセージの後ろに置き、キャッシュの切れ目もその後ろに作る。", "スキルには分けるが、20種類の本文をすべてシステムプロンプトへ常時入れる。取りこぼしを防ぎ、共通部分は先頭でキャッシュする。本文の遅延読み込みはしない。"], "notes": ["接頭辞のキャッシュは正しいが、手順を段落に割ると、事故の原因になった「全文とスクリプトをまとめて載せる」を満たさない。", "段階的開示で全文を必要なときだけ載せ、安定した接頭辞はキャッシュする。", "段階的開示は正しいが、安定したメタデータを変化するメッセージの後ろに置いており、キャッシュされる接頭辞にならない。", "キャッシュの位置は正しいが、全文を常時読むので6万トークンの一括コンテキストが残る。"], "ans": [1], "why": "毎回のうち一部しか使わず、しかも使うときはモジュール全体が要る手順は、Agent Skillsの段階的開示が合います。常時読むのは名前と説明（1件あたり約100トークン）で、本文はトリガーされたときだけ読みます。変わらない共通部分は、tools、system、messagesの順で先頭に置き、キャッシュします。全文の常時展開、段落だけの検索、安定部分を利用者メッセージの後ろに置く配置は、この条件を外します。", "src": "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview"}, {"no": 29, "d": 7, "dn": "分野7 開発者の生産性と運用支援", "multi": false, "pick": 1, "stem": "セキュリティ部門から、全部門のClaude Codeで、.envの読み取りと本番デプロイのコマンドを禁止し、開発者が自分の設定で外せないようにしてほしい、と依頼されました。最も適切な構成はどれですか。", "opts": ["全社向け管理ポリシーの CLAUDE.md に、.envを読まないことと本番デプロイをしないことを書く。必ず読まれる指示なので、権限設定より優先して強制される、という判断である。", "MDMで各端末の ~/.claude/settings.json に deny を配布する。利用者の設定ファイルを揃えれば、組織としての禁止になる、という判断である。", "管理設定（管理コンソールからのサーバー管理、MDM、または managed-settings.json）で、permissions.deny にその禁止を入れて配布する。", "リポジトリの .claude/settings.json に同じ deny をコミットし、CODEOWNERSでそのファイルの変更を制限する。個人の上書きはレビューで防ぐ。"], "notes": ["組織配布のCLAUDE.mdでも、中身は指示であり、permissions.deny のような強制ではない。", "MDMは管理設定を配る手段にはなるが、配る先が利用者設定では最下層のまま、本人が変更できる層である。", "管理設定が最も優先され、利用者やプロジェクトの設定では上書きできない。", "共有プロジェクト設定はチームの既定であり、優先順位ではローカル設定より下である。上書きできない組織の強制は管理設定の役割。"], "ans": [2], "why": "Claude Codeの優先順位は、管理設定、コマンドライン、プロジェクトのローカル設定、共有プロジェクト設定、利用者設定です。個人の設定で外せない禁止は、管理設定の permissions.deny で配ります。共有の settings.json はチームの既定、利用者の settings.json は本人の層、CLAUDE.md は指示です。権限ルールは deny、ask、allow の順で、allowは deny の例外を作れません。", "src": "https://code.claude.com/docs/en/settings"}, {"no": 30, "d": 7, "dn": "分野7 開発者の生産性と運用支援", "multi": false, "pick": 1, "stem": "Claude Codeの導入後、AIが作成したプルリクエストが増え、レビューの待ちと不具合の混入が問題になっています。テストはCIにあります。開発の進め方として最も適切なものはどれですか。", "opts": ["テストとlintをフックまたはCIのゲートにする。AIが作成した変更にも、人のレビュー基準を同じように適用する。規約は CLAUDE.md にまとめ、変更は小さく分ける。", "テストとlintのゲート、小さい変更、CLAUDE.md は同じにする。CIが成功したAI作成の変更は人が2割を抜き取り、残りはマージして待ち行列を解消する。", "人のレビューは全件維持する。AIの変更は大きいままでよく、CIは人と二重なので外し、規約はレビューアが知っていれば CLAUDE.md には書かず口頭に残す。", "フックでlintを止め、CIを必須にし、CLAUDE.md と小さい変更も使う。レビューは第二のClaudeが承認し、二つのモデルが一致しないときだけ人が見て、一致なら省く。"], "notes": ["自動ゲートと、作成者が誰でも同じ人のレビューと、共有された規約を同時に置いている。", "ゲートと規約は正しいが、成功したCIを理由に8割の人のレビューを免除している。抜き取りはマージの基準の代わりにならない。", "人の基準は残るが、待ちと混入の原因である大きい変更と、自動ゲートと、モデルが読む規約を外している。", "自動ゲートと規約と分割は正しいが、人のレビュー基準をモデル同士の一致へ置き換えている。"], "ans": [0], "why": "AIが作成した変更も、本番の前に人のレビュー基準を通します。テストやlintはフックとCIのゲートにし、規約はCLAUDE.mdに置き、プルリクエストは小さく分けます。CIの成功や、もう一つのモデルの承認は、その人の基準を免除する理由になりません。PreToolUseフックが終了コード2を返すと、そのツール呼び出しは止まります。", "src": "https://code.claude.com/docs/en/hooks"}];

 $("qStem").textContent=q.stem;
 var box=$("qOpts");box.innerHTML="";
 q.opts.forEach(function(o,j){
  var lab=document.createElement("label");lab.className="opt";
  var inp=document.createElement("input");inp.type=q.multi?"checkbox":"radio";inp.name="o";inp.value=j;inp.checked=sel.indexOf(j)>=0;inp.disabled=done;
  inp.onchange=function(){pick(q,j,inp.checked);};
  lab.appendChild(inp);
  var sp=document.createElement("span");sp.innerHTML='<span class="lt">'+L[j]+'.</span> '+esc(o)+(done?'<span class="note">'+(q.ans.indexOf(j)>=0?"○ ":"× ")+esc(q.notes[j])+'</span>':"");
  lab.appendChild(sp);
  if(done){if(q.ans.indexOf(j)>=0)lab.classList.add("correct");else if(sel.indexOf(j)>=0)lab.classList.add("wrong");}
  else if(sel.indexOf(j)>=0)lab.classList.add("sel");
  box.appendChild(lab);
 });
 var c=$("bCheck");c.disabled=done||(q.multi?sel.length!==q.pick:sel.length!==1);
 c.textContent=done?"採点済み":(q.multi&&sel.length!==q.pick?q.pick+"つ選んでください":"答え合わせ");
 $("bPrev").disabled=st.cur===0;
 $("bNext").textContent=st.cur===Q.length-1?"結果を見る →":"次へ →";
 var r=$("qRes");
 if(done){var ok=isOk(q);r.className="res "+(ok?"ok":"ng");
  r.innerHTML="<h3>"+(ok?"正解！":"不正解")+"　正解："+q.ans.map(function(a){return L[a];}).join(",")+"</h3><div>"+esc(q.why)+'</div><div class="src">出典：'+esc(q.src)+"</div>";}
 else{r.className="res hide";r.innerHTML="";}
}
function pick(q,j,on){
 if(st.chk[q.no])return;
 var s=(st.sel[q.no]||[]).slice();
 if(q.multi){var k=s.indexOf(j);if(on&&k<0)s.push(j);if(!on&&k>=0)s.splice(k,1);}else s=[j];
 st.sel[q.no]=s;save();renderQ();renderPal();
}
function check(){var q=Q[st.cur];var s=st.sel[q.no]||[];if(st.chk[q.no])return;if(q.multi?s.length!==q.pick:s.length!==1)return;st.chk[q.no]=true;save();renderQ();renderPal();renderHead();}
function renderResult(){
 var s=score();var pct=Math.round(s.ok/s.tot*100);
 $("rScore").textContent=s.ok+" / "+s.tot;$("rPct").textContent="（"+pct+"%）";
 $("rMsg").textContent=pct>=80?"合格の目安（80%）に達しています。不正解の問題の解説を確認しましょう。":"目安の80%に届いていません。正答率の低い分野の章を復習しましょう。";
 var tb=$("rTbl");tb.innerHTML="";
 ORDER.forEach(function(d){var b=s.by[d];if(!b.n)return;var p=Math.round(b.ok/b.n*100);
  var tr=document.createElement("tr");tr.setAttribute("data-d",d);
  tr.innerHTML="<td>"+esc(DN[d])+"</td><td>"+b.ok+" / "+b.n+"</td><td style=\"color:"+(p>=60?"var(--ok)":"var(--ng)")+"\">"+p+"%</td>";tb.appendChild(tr);});
 var w=Q.filter(function(q){return !isOk(q);});
 $("rWrong").innerHTML=w.length?"<p><b>見直す問題：</b>"+w.map(function(q){return '<a href="#" data-go="'+(q.no-1)+'">問'+q.no+(st.chk[q.no]?"":"（未回答）")+"</a>";}).join("、")+"</p>":"<p>全問正解です！</p>";
 Array.prototype.forEach.call($("rWrong").querySelectorAll("a[data-go]"),function(a){a.onclick=function(e){e.preventDefault();st.cur=+a.getAttribute("data-go");save();renderQ();renderPal();$("vQ").scrollIntoView({behavior:"smooth"});};});
 $("vR").classList.remove("hide");$("vR").scrollIntoView({behavior:"smooth"});
}
$("bPrev").onclick=function(){if(st.cur>0){st.cur--;save();renderQ();renderPal();}};
$("bNext").onclick=function(){if(st.cur<Q.length-1){st.cur++;save();renderQ();renderPal();window.scrollTo(0,0);}else renderResult();};
$("bCheck").onclick=check;
$("bResult").onclick=renderResult;
$("bReset").onclick=function(){if(confirm("回答と経過時間をすべてリセットしますか？")){st=blank();save();renderQ();renderPal();renderHead();$("vR").classList.add("hide");}};
var last=Date.now();
setInterval(function(){var now=Date.now();if(!document.hidden){st.elapsed+=(now-last)/1000;}last=now;$("sTime").textContent=fmt(st.elapsed);save();},1000);
$("sTime").textContent=fmt(st.elapsed);
if(st.cur<0||st.cur>=Q.length)st.cur=0;
renderQ();renderPal();renderHead();
window.__ccarp={Q:Q,state:function(){return st;},score:score};
})();
</script>
</body>
</html>
