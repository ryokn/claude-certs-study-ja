<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F 模擬試験（日本語）</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f1f1f;--muted:#666;--accent:#c96442;--ok:#1d7a46;--okbg:#e6f4ec;--ng:#b3261e;--ngbg:#fbeaea;--line:#e2dfd8}
*{box-sizing:border-box}
body{margin:0;overflow-wrap:anywhere;word-break:break-word;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
header{position:sticky;top:0;z-index:10;background:#fffdf9;border-bottom:1px solid var(--line);padding:8px 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:860px;margin:0 auto}
.bar h1{font-size:16px;margin:0 8px 0 0}
.pill{background:#f0ece4;border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:860px;margin:0 auto;padding:12px}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px}
.nav a{display:inline-block;min-width:34px;text-align:center;padding:2px 4px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink);text-decoration:none}
.nav a.answered{background:#f3e7df}
.nav a.correct{background:var(--okbg);border-color:var(--ok)}
.nav a.wrong{background:var(--ngbg);border-color:var(--ng)}
.card{scroll-margin-top:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.tag{display:inline-block;background:#f0ece4;border-radius:6px;padding:0 6px;margin-right:4px}
.qtext{white-space:pre-wrap;margin:6px 0 10px}
.multi{color:var(--accent);font-weight:bold}
label.choice span{min-width:0}
label.choice{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
label.choice input{margin-top:6px;flex:none;width:18px;height:18px}
label.choice.ok{background:var(--okbg);border-color:var(--ok)}
label.choice.ng{background:var(--ngbg);border-color:var(--ng)}
.letter{font-weight:bold;flex:none}
.actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.verdict{font-weight:bold}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.exp{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.exp li{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{border:1px solid var(--line);padding:6px;text-align:left}
th{background:#f6f2ea}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:520px){body{font-size:15px}.bar h1{font-size:15px;width:100%}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>CCAR-F 模擬試験</h1>
  <span class="pill" id="progress">0/0</span>
  <span class="pill" id="timer">00:00</span>
  <button id="btnResult" class="primary">結果を見る</button>
  <button id="btnReset">リセット</button>
</div></header>
<main>
  <p class="hint" id="intro"></p>
  <div class="nav" id="nav"></div>
  <div id="qs"></div>
  <div class="card" id="result" hidden></div>
</main>
<script>
const DATA = {"items": [{"id": 1, "d": "D1", "task": "1.1", "scenario": "シナリオ1 カスタマーサポート解決エージェント", "q": "サポートエージェントは、応答にテキストが含まれると最終回答として停止しています。ログには次の2件があります。(1) stop_reason は tool_use で、テキスト1文とクライアント向け tool_use が2件（lookup_order と get_customer）同じ応答に同居している。(2) stop_reason は pause_turn で、サーバ側検索の途中経過のテキストだけで、クライアント向け tool_use はない。両方に対する制御として正しいものはどれですか。", "multi": 1, "choices": [{"t": "tool_useは全件実行するが、次には結果だけを送る。assistant応答はAPIが保持しているので履歴へ足さない。pause_turnは捨て、空の新規セッションで最初からやり直す。", "ok": false, "why": "メッセージAPIは会話を保持しない。assistant 応答を省くと tool_use_id の対応が次のリクエストに存在しない。pause_turn は新規セッションで捨てる状態ではなく、同じ履歴を送り返して続行する状態である。"}, {"t": "assistant応答は毎回履歴へ足す。tool_useは全件実行し、tool_resultを先頭にしたuser1件で続ける。pause_turnは偽の結果を足さず再送し、end_turnだけ終了する。", "ok": true, "why": "APIはステートレスなので assistant 応答も毎回送る。並列の tool_use はすべて実行し、対応する tool_result を次の user メッセージの先頭にまとめる。pause_turn はサーバ側ツールが反復上限に達した合図で、失敗ではない。その応答をそのまま送り返して続行し、こちらで tool_result を作らない。終了は end_turn で判断し、テキストの有無では判断しない。"}, {"t": "assistant応答は毎回履歴へ足す。tool_useだけ実行し、結果はツールごとに別のuserで返す。pause_turnはend_turnと同じく、同梱テキストを最終回答として必ずそこで終了する。", "ok": false, "why": "tool_use と end_turn の二者だけを覚えると、pause_turn を最終回答にしてサーバ側の続きを切ってしまう。複数の tool_use は結果を1つの user メッセージにまとめる。ツールごとに user を分けると、対応関係と次の推論の単位が崩れる。"}, {"t": "pause_turnはサーバの失敗なので、is_errorの結果を1件作って終了する。複数のtool_useは先頭だけ実行し、残りは破棄してその場で打ち切る。先頭以外は失敗として捨てる。", "ok": false, "why": "pause_turn はエラー終了ではない。偽の tool_result を足すと、存在しない tool_use_id への結果になり、続行の手順でもない。同一応答の tool_use は先頭だけでなくすべて実行する。"}], "answer": ["B"]}, {"id": 2, "d": "D1", "task": "1.2", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "リサーチのコーディネーターは、質問ごとに使うサブエージェントをすでに選別しており、無関係な段は呼んでいません。依頼「クリエイティブ産業の市場規模」では視覚芸術の検索だけが選ばれ、そのエージェントと統合エージェントは割り当て範囲では高品質な結果を返しました。音楽・ゲーム・出版は報告書に無く、不足を見て追加調査する処理もありません。最初に直すべき点はどれですか。", "multi": 1, "choices": [{"t": "統合が欠落に気づいたら検索担当を直接呼び直す。コーディネーターは初回の分解だけ行い、再調査の経路からは外れたまま終わる。", "ok": false, "why": "カバレッジの穴を埋める再調査自体は必要だが、呼び出すのはコーディネーターである。サブエージェント同士を直接つなぐと、ハブアンドスポークが担う観測・一貫したエラー処理・情報の制御を失う。"}, {"t": "視覚芸術担当の取得と反復を増やし、同じ担当のまま全体を覆う。統合は1回で終え、他産業の担当も再委任のループも作らない。", "ok": false, "why": "担当外の産業を、同じ視覚芸術エージェントの取得量で埋めることはできない。下流の品質はすでに十分で、失敗しているのは割り当て範囲と欠落の再評価である。"}, {"t": "全段を呼ぶのが原因なので、必要な相手だけを選ぶ方式へ変える。範囲と、欠落後の再委任は今の分類のまま、広げない。再委任は足さない。", "ok": false, "why": "必要な相手だけを選ぶ動作はすでに入っている。それを再指定しても、視覚芸術だけに閉じた割り当ては広がらない。今回の欠落はルーティングの有無ではなく、分割の狭さである。"}, {"t": "分割が視覚芸術に偏っている。情報源の種類へ広げ、欠ける主題はコーディネーターが再委任する。サブエージェント同士は直接呼ばせない。", "ok": true, "why": "下流が割り当て内で正しくても、分解が狭すぎれば報告書は欠ける。動的選択はすでに有効なので、直すのは範囲と、不足を評価してコーディネーター経由で再委任するループである。サブエージェント同士の直接呼び出しは、観測とエラー処理を分散させる。"}], "answer": ["D"]}, {"id": 3, "d": "D1", "task": "1.3", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "ウェブ調査と社内文書調査は互いに依存しません。コーディネーターはそれらを別ターンで順に Task 呼び出しし、返ってきた調査メモを自分の言葉で一段落へ書き直してから、次のターンで統合サブエージェントへ渡しています。統合の指示文は「手順1から4を実行」という番号リストです。出典の対応が段落の中で消え、二つの調査は直列のままです。要件を満たす直し方はどれですか。", "multi": 1, "choices": [{"t": "依存しない調査は1応答で並行してTaskを出す。統合は次のターンで、claimと出典の欄を分けた記録をそのまま渡す。指示は目標と基準だけにする。", "ok": true, "why": "依存しない Task はコーディネーターの1応答にまとめて並行化する。統合は両方の結果が必要なので同じ応答には入れず、次のターンで呼ぶ。渡すのは書き直した文章ではなく、主張と出典メタデータを分けた記録である。コーディネーターへの指示は手順の羅列ではなく目標と品質基準にする。"}, {"t": "三つのTaskを最初の1応答で同時に出す。統合には親の推論全文を貼り、手順番号も残す。結果より先でも空欄のまま進めてよいとする。", "ok": false, "why": "統合は二つの調査結果に依存するため、結果が返る前の同じ応答では並行化できない。親の推論チェーン全文は、構造化した主張と出典の代わりにならない。手順リストを残すと、サブエージェントが状況に合わせて動く余地も狭い。"}, {"t": "調査は別ターンのままにし、統合のdescriptionへ調査全文を書き込む。定義は毎回配られるので、呼び出しのプロンプトへは記録を載せずに済む。", "ok": false, "why": "description は「いつそのサブエージェントを使うか」の定義であり、呼び出しごとの証拠置き場ではない。実行のたびに書き換えるものでも、他の依頼へ調査全文を配るものでもない。渡す場所は、その呼び出しの Task プロンプトである。"}, {"t": "二つの調査は1応答で並行化する。統合は検索側から直接呼び、渡すのは一段落の要約だけにはする。出典の欄には分けず、対応は残さない。", "ok": false, "why": "独立な調査の並行化だけは方向が合う。しかし統合の起動と情報の流れはコーディネーター経由に保つ。一段落の要約では claim と source の対応が消え、今回失われている出典を復元できない。"}], "answer": ["A"]}, {"id": 4, "d": "D1", "task": "1.3", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "Agent SDK のコーディネーターは、定義済みの web-searcher を一度も起動せず自分で答えています。allowedTools には既に \"Task\" があります。web-searcher の description は「汎用のアシスタント」です。コーディネーターのツールには WebSearch があり、システムプロンプトは「自分で検索して答えてよい。サブエージェントは任意」です。直すべき点を2つ選んでください。", "multi": 2, "choices": [{"t": "親の履歴を読ませるsharedHistoryを足す。履歴が見えれば、descriptionが汎用のままでも必要なとき自分から起動するとみなす。", "ok": false, "why": "親の履歴をサブエージェントへ自動で渡す設定はない。渡るのは Task のプロンプトと、そのエージェント自身の定義である。共有フラグを足しても未起動の原因は残る。"}, {"t": "descriptionを、公開ウェブの事実が要るときに選ぶ条件文へ変える。委任の判断に使うのはこの説明で、汎用の一言では選ばれない。", "ok": true, "why": "description は、どのサブエージェントへ委任するかをモデルが判断する材料で、AgentDefinition の必須項目である。「汎用のアシスタント」では使う条件が無く、Task が許可されていても選ばれない。"}, {"t": "toolsは省略して親の道具を継承させ、コーディネーターにも同じ一式を足す。どちらでも検索できる方が、起動しない失敗には強くなる。", "ok": false, "why": "tools の省略は親のツール継承であり、起動しない原因の修正ではない。コーディネーターに同じ検索手段を増やすと、委任せず自分でやる経路がさらに太くなる。"}, {"t": "コーディネーターからWebSearchを外し、プロンプトは委任の目標と出典の品質基準だけにする。自分で検索してよいという指示は置かない。", "ok": true, "why": "コーディネーターが専門ツールを持ち「自分でやれ」と指示されていると、Task があっても自分で完結する。専門ツールはサブエージェント側に置き、親のプロンプトは目標と品質基準にして、手順の羅列にしない。"}, {"t": "Taskは入っているのでmax_tokensを増す。出力上限が小さいとTaskのJSONが途中で切れ、サブエージェントを出せなくなると考える。", "ok": false, "why": "今回のログは Task を出さずに自分で答えている。出力上限は、委任の判断をしない原因ではない。allowedTools に Task があることと、実際に Task を選ぶことは別である。"}], "answer": ["B", "D"]}, {"id": 5, "d": "D1", "task": "1.4", "scenario": "シナリオ1 カスタマーサポート解決エージェント", "q": "1通のメッセージに、$800 の返金、配送先の変更、先月の二重請求が入っています。社内規則では $500 を超える返金に人間の承認が必要で、システムプロンプトにも書いてあります。それでもログの約2%で process_refund が承認なしに実行されています。担当者は別システムを使っており、この会話ログを開けません。要件を満たす対応はどれですか。", "multi": 1, "choices": [{"t": "返金の実行後、PostToolUseで超過を見つけ取消APIを呼ぶ。担当者には返金済みで詳細は顧客に確認、という一文だけを渡し、内訳は付けないまま。", "ok": false, "why": "実行後の取消では、返金と通知がすでに走っている。止める場所は実行前である。一文の引き継ぎでは、ログを見られない担当者が三案件を再構成できない。"}, {"t": "実行前フックで承認までprocess_refundを拒否する。その担当者には会話IDだけを渡し、金額や推奨は付けない。詳細は顧客に最初から順に説明し直してもらう。", "ok": false, "why": "拒否フックは金額規則には合う。しかし担当者は会話を開けないので、会話IDだけでは顧客IDも金額も推奨も届かない。説明のやり直しを顧客へ戻すのも、ハンドオフの欠落を埋めていない。"}, {"t": "検証済み顧客と承認が揃うまで、実行前フックでprocess_refundを拒否する。引き継ぎは会話IDではなく、案件ごとのID・状況・金額・実施済み・推奨を渡す。", "ok": true, "why": "金額と本人確認のように破ってはいけない規則は、プロンプトでは失敗率がゼロにならない。実行前のフックで、検証済みIDと承認が揃うまで process_refund を止める。担当者はログを見られないので、会話IDではなく案件ごとの構造化サマリーを渡す。どちらか片方では、不正返金か引き継ぎ不能かが残る。"}, {"t": "500ドル超はプロンプトとfew-shotで補強し、フックでは拒否しない。担当者にはID・状況・金額・実施済み・推奨を構造化して渡す。確率は残る。", "ok": false, "why": "構造化サマリーは、ログを見られない担当者には必要である。一方、プロンプトと few-shot は確率の改善で、金銭規則の保証にはならない。すでに約2%が抜けている経路が残る。"}], "answer": ["C"]}, {"id": 6, "d": "D1", "task": "1.5", "scenario": "シナリオ1 カスタマーサポート解決エージェント", "q": "process_refund は $500 超なら人間の承認が必要です。同時に、配送照会の結果は Unix時刻・ISO 8601・「11/03 14:00」と、状態コード 0/1/2 が混在し、モデルが時系列と状態を取り違えます。提案された実装は、PreToolUse で金額が 500 を超えたら amount を 500 に書き換えて許可し、時刻の表記はシステムプロンプトの表で解釈させています。規則どおりの実装はどれですか。", "multi": 1, "choices": [{"t": "PreToolUseは500ドル超の返金をdenyし、escalate_to_humanへ誘導する。配送結果の時刻と状態はPostToolUseで先に正規化する。", "ok": true, "why": "承認が必要な返金は、実行前の PreToolUse で拒否し、permissionDecisionReason で代替手順をモデルへ伝える。500 への書き換えは、頼んでいない金額の返金を承認なしに実行する。結果側の表記ゆれは、モデルが見る前に PostToolUse の updatedToolOutput で置換する。入力フックでは結果を変えられない。"}, {"t": "PreToolUseのupdatedInputでamountを500に下げて許可する。超過分は承認不要とみなす。配送結果の時刻も同じ入力フックで、呼ぶ前にISOへ直せるとする。", "ok": false, "why": "金額の丸めは承認の代替にならない。配送ツールの乱れた時刻と状態は引数ではなく結果にある。PreToolUse の updatedInput が変えられるのは、これから投げる呼び出しの入力である。"}, {"t": "金額も表記もプロンプトだけに書き、フックは常にallowを返す。denyは後続の住所変更まで止めるので、ツール単位の拒否は使わないまま、モデルの判断だけに残す。", "ok": false, "why": "1件の deny はそのツール呼び出しを止めるだけで、理由を返せばモデルは escalate_to_human など別のツールで続行できる。プロンプトだけに戻すと、金額規則は再び確率的になる。表記の解釈も表の読み落としが残る。"}, {"t": "返金は実行し、PostToolUseで超過の結果をエラー文へ差し替えて取り消したことにする。配送の時刻と状態も、実行後の同じフックで正規化する。形も揃えて返す。", "ok": false, "why": "PostToolUse の時点で返金APIは終わっている。結果をエラー文へ差し替えても、副作用は戻らない。配送結果の正規化を PostToolUse に置くこと自体は位置として合うが、返金の阻止と同時にはできない。"}], "answer": ["A"]}, {"id": 7, "d": "D1", "task": "1.5", "scenario": "シナリオ4 Claudeによる開発者の生産性向上", "q": "返金ツールに二つの制御が重なっています。シェルの PreToolUse フックはポリシー文を標準エラーへ出して終了コード 0 で終わらせ、ブロックしたつもりです。同じツールに SDK の PreToolUse が二つマッチし、$800 の呼び出しに対して、一方は 500 超で deny、他方は 1000 未満で allow を返します。実際の挙動と、合わせるべき設定はどれですか。", "multi": 1, "choices": [{"t": "SDKは500以下をallow、超過をdenyの一つにまとめ、シェルは0のまま文の出力を拒否として残す。その文を読めば、モデルがツールを自らの判断で見送れる。", "ok": false, "why": "SDK を一つの判定へまとめること自体は競合を消すが、シェルの終了コード 0 はブロックにならない。ツールはモデルが文章を読む前に実行される。見送りをモデルの判断に戻した時点で、決定論的な拒否ではなくなる。"}, {"t": "シェルは終了コード2だけが拒否で、0では実行される。SDKの判定が割れてもdenyが優先し、800ドルは拒否される。シェルを2へ直し、登録順でallowを勝たせない。", "ok": true, "why": "コマンドフックが PreToolUse を止めるのは終了コード 2 である。0 で文章を出しても呼び出しは通る。SDK 側で複数フックの permissionDecision が割れたときは deny が最優先で、登録順や allow の後勝ちではない。$800 は 500 超の deny が効く。"}, {"t": "標準エラーに文があれば終了コード0でも拒否される。SDKは後から登録したallowが勝つので800ドルは許可される。allowをdenyより後ろへ移せば足りる。", "ok": false, "why": "ブロックの条件は終了コードであり、標準エラーに文字があることではない。SDK の競合は allow の登録順では解決せず、deny が優先する。フックを入れ替えても $800 は拒否側が勝つ。"}, {"t": "PostToolUseFailureは実行の前に走るので、シェルは0のままでもこのイベントで800ドルを拒否できる。SDKのallowとdenyは捨て、失敗フックだけを残す。", "ok": false, "why": "PostToolUseFailure はツールが失敗したあとのイベントで、成功し得る呼び出しを事前に止める場所ではない。実行前の拒否は PreToolUse の deny、コマンドフックなら終了コード 2 である。"}], "answer": ["B"]}, {"id": 8, "d": "D1", "task": "1.6", "scenario": "シナリオ4 Claudeによる開発者の生産性向上", "q": "同じ週に二つの依頼があります。(A) 仕様が分かっている決済モジュール40ファイルを、ファイルごとのチェックリストで確認したあと、ファイルをまたぐデータフローだけを別パスで見る。(B) 初めて触る10万行について、テストをどこへ足すか自体がまだ分からない。依頼ごとに採る分解はどれですか。", "multi": 1, "choices": [{"t": "AもBも決めた順の固定連鎖にする。それに加えてBはファイル名の順にテストを書き、見直しはしない。Aの横断パスは費用のためローカルパスへ合流させる。", "ok": false, "why": "固定の連鎖は、手順が見えているAには使えるが、横断パスを合流させると注意の分散が戻る。Bは範囲が開いているので、ファイル名順の固定パイプラインでは依存も重要度も見ない。"}, {"t": "Aは大きいモデルの1パスへまとめ、ファイル内と横断を同時に見る。Bは3回調べ、3回とも出た候補だけを採り、1回だけの候補は捨てる。単発は残さない。", "ok": false, "why": "1パスへまとめると、ファイル内と横断のどちらも注意が薄まる。モデルを大きくしても、その分割の欠落は埋まらない。3回の多数決は、毎回は出ない本物の欠陥や必要なテストまで落とす。"}, {"t": "AもBも毎回計画を作り直す。Aの横断はファイル内へ溶かし、別パスにはしない。Bは優先を付けず、見つかった順に手を付けて終える。横断パスは置かない。", "ok": false, "why": "動的な分解はBには合うが、Aから横断パスを外すと、ファイル内では見えないデータフローの欠陥が残る。開いた調査で優先順位を付けないのも、影響の大きい領域から進む手順ではない。"}, {"t": "Aはファイルごとのパスのあと横断パスを分ける固定の連鎖にする。Bは危険な領域から計画し、発見のたびに変える。1回の長文にも3回の多数決にもしない。", "ok": true, "why": "手順が事前に分かる多面的レビューは、ファイル単位のパスと横断パスを分けた固定の連鎖が合う。注意を1回に集めないためである。どこを調べるか自体が開いている調査は、構造の把握から入り、発見に応じて分解を変える。多数決や単一の長文は、どちらにも使わない。"}], "answer": ["D"]}, {"id": 9, "d": "D1", "task": "1.7", "scenario": "シナリオ4 Claudeによる開発者の生産性向上", "q": "名前付きセッション auth-refactor は3日前のものです。30ファイルを分析しましたが、その後22ファイルと依存ライブラリが変わり、履歴に残るツール結果の大半は変更前の実装です。今も使えるのはアーキテクチャのメモだけです。同僚は、その現行コードを共通の起点にして、二つの改修案を比べたいと言っています。進める手順はどれですか。", "multi": 1, "choices": [{"t": "auth-refactorをresumeし、変わった22ファイルだけ読み直す。二つの案も同じ再開の中で順に試し、会話の枝は分けないまま比べる。", "ok": false, "why": "変更が一部で、以前のコンテキストがおおむね有効なときの手順である。今回はツール結果の大半が古く、依存も変わっている。再開は古い観測を土台にしたままになる。同じ会話で二つの案を続けると、後の案が前の案の文脈を見てしまう。"}, {"t": "3日前のセッションをすぐforkし、枝ごとに案を進める。forkは作業ツリーも分けるので、現行の再読込も要約の注入も不要になる。", "ok": false, "why": "fork は会話履歴の分岐で、ファイルシステムの分岐ではない。古いセッションから分けると、両方の枝が変更前のツール結果を引き継ぐ。比較の前に、現行コードを読んだ新しい起点が要る。"}, {"t": "古い結果は再開しない。有効な構造メモを新しいセッションへ注入し、現行を読み直す。二つの案は、その新しいセッションをforkした枝で比べる。", "ok": true, "why": "ツール結果の大半が古いときは、再開して古い観測を抱えるより、構造化した要約を注入した新規セッションの方が信頼できる。二つの案を同じ起点から比べるのは、その新鮮なセッションを fork してからである。fork は会話の分岐であり、古いツール結果を新しいファイル内容へ更新はしない。"}, {"t": "セッションは捨て、要約も注入しない空の会話で二つの案を順に実装する。古いメモは劣化しているので、構造は実装しながら把握していく。", "ok": false, "why": "空の開始は、今も有効なアーキテクチャメモまで捨てる。新規にするなら構造化した要約を注入し、現行ファイルを読み直す。二つの案を一つの会話で順に実装すると、比較の起点も分かれる。"}], "answer": ["C"]}, {"id": 10, "d": "D2", "task": "2.1", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "extract_web_results と extract_pdf_sections の説明は、入力例、使わない場合、出力の形まで既に書いてあります。それでも本文に「ドキュメント」という語があるか、PDFへのリンクがあるだけで、ウェブ結果が PDF用ツールへ流れます。システムプロンプトに「ドキュメントという語があれば必ず文書解析ツールを使う」という一文があります。最初に採る対応はどれですか。", "multi": 1, "choices": [{"t": "語でツールを強制する一文を消し、リンクだけではウェブ用と境界に書く。解析を頼まれたときだけPDF用を使う。説明の水増しや前段の分類は先にしない。", "ok": true, "why": "説明が十分でも、キーワードに反応するシステムプロンプトがツール選択を上書きする。最初に外すのはその一文で、境界文は「リンクがあるだけはウェブ用」に揃える。説明をさらに足すことや、語でツールを固定する分類器は、上書きが残ったままでは効かない。"}, {"t": "二つのツールをanalyzeへ統合し、kindでウェブとPDFを分ける。強制の一文はkindを文書にする、へ書き換え、語による指定そのものは残す。", "ok": false, "why": "似たツールは統合せず、入出力の契約を分けたままにする。強制文を kind の指定へ移すと、語を見ただけでPDF側へ倒す挙動は残る。"}, {"t": "呼び出し前に文書という語とリンクを見る分類器を置き、該当すればPDF用を固定する。ツール説明と、強制の一文はどちらも変更しないまま。", "ok": false, "why": "分類器は、問題の一文と同じキーワード規則をコードへ移しただけである。モデルのツール選択を前段で上書きする過剰な経路になり、リンクだけのウェブページもPDFツールへ固定される。"}, {"t": "説明は十分なので正しい例を6件足し、強制の一文は残す。例はキーワードより優先されるので、文書という語があってもウェブ用を選ぶようになる。", "ok": false, "why": "詳細な説明のあとで一貫しないツール選択の、最初の原因がプロンプトの強制文であるときに、例を足しても強制文は残る。例の追加は、ツールの境界がまだ書けていないときの最初の一手でもない。"}], "answer": ["A"]}, {"id": 11, "d": "D2", "task": "2.2", "scenario": "シナリオ1 カスタマーサポート解決エージェント", "q": "注文検索ツールは次の3種を、どれも {\"error\": \"Operation failed\"} と isError: true で返しています。(1) タイムアウト。(2) 検索は成功したが該当注文が0件。(3) 返品期限を過ぎたポリシー違反。エージェントは3種とも再試行し、0件のときは報告書に「情報源が存在しない」と書きます。ツールが返すべき契約はどれですか。", "multi": 1, "choices": [{"t": "3種ともisErrorにせず空の成功として返す。上位は該当なしで続行し、再試行もエスカレーションもしない。止めたくないので、失敗の区別は捨てる。", "ok": false, "why": "失敗を空の成功で返すのは握りつぶしである。タイムアウトの再試行も、期限切れの説明も起きない。0件だけが成功の空であり、他の2種は失敗として構造化する。"}, {"t": "タイムアウトはローカルで再試行し、残れば種別・クエリ・部分結果・代替を返す。0件は成功の空でisErrorにしない。期限切れは再試行不可とし、全体は止めない。", "ok": true, "why": "失敗の種類で復旧が変わる。一時的な失敗はローカルで再試行し、残るものだけ構造化して上位へ返す。検索成功の0件はアクセス失敗ではないので isError にしない。ポリシー違反は再試行しても成功せず、顧客に説明できる文が要る。空の成功で握りつぶすことと、1件の失敗で全体を止めることは、どちらも契約に入れない。"}, {"t": "3種ともisErrorと再試行可のまま、文面だけ分ける。0件も失敗として再試行し、3回で情報源が無いと返す。期限切れも同じ回数だけ再試行する。空も失敗のまま。", "ok": false, "why": "文章が分かれていても、再試行可否が同じならエージェントは期限切れを再試行し続ける。成功した0件を失敗にすると、有効な空結果とアクセス失敗の区別が消え、存在しないという誤った結論になる。"}, {"t": "1件でも失敗したら全体を終了し、顧客へ再問い合わせを案内する。0件も失敗に含め、部分結果も代替クエリも上位へは返さずに終わる。代替は返さない。", "ok": false, "why": "1件の失敗で全体を終了すると、住所変更など残りの用件まで落ちる。上位が判断するには、失敗の種類・試したクエリ・部分結果・代替が必要で、それらを捨てる終了は使わない。"}], "answer": ["B"]}, {"id": 12, "d": "D2", "task": "2.3", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "各サブエージェントのツールは役割あたり5個まで減っています。ただし統合サブエージェントには、複雑な調査用の web_search が残っています。統合のターンの約3割では、主張1件の裏取りだけが必要です。複雑な再調査はコーディネーターへ戻したいです。web_search のせいで、統合が調査を始めて報告書から逸れることがあります。設定はどれですか。", "multi": 1, "choices": [{"t": "web_searchは残し、説明に簡単な裏取りだけと書く。tool_choiceはanyにして毎ターン必ずどれかを呼ばせる。verify_factという狭い道具は追加しない。", "ok": false, "why": "説明で用途を狭めても、汎用検索が手近にあると調査へ逸れる。any はツールの種類を指定せず、裏取りが不要なターンでも呼び出しを強制する。必要なのは道具を狭くすることである。"}, {"t": "統合は毎ターンverify_factを強制し、web_searchも残す。不要なターンは空のclaimで呼んでから文章を書く。複雑な調査を上位へ戻す経路は作らない。", "ok": false, "why": "特定ツールの強制を毎ターンに置くと、裏取りが不要なときもそのツールが必須になる。web_search が残っていれば、強制を外した瞬間に調査へ戻る。複雑な再調査の返却先も無い。"}, {"t": "裏取りしそうな主張は統合の前に一括検索する。必ず途中の追加確認は禁止し、web_searchは全員へ配ったまま、tool_choiceはautoのままにする。", "ok": false, "why": "統合してみないと出てこない主張を、開始前の一括検索では拾えない。依存してから必要になる確認を前倒しすると、無関係な結果で待ち、足りないものは結局その場で要る。全員への web_search は過剰な権限のままである。"}, {"t": "統合からweb_searchを外し、主張1件のverify_factだけを足す。複雑な調査は上位へ戻す。tool_choiceはautoのまま、不要なターンは文章で終える。", "ok": true, "why": "役割外の汎用検索が残ると、件数を5個にしても誤用される。頻繁な裏取りだけを、入力と出力を狭めた verify_fact に限る。複雑な検索はコーディネーター経由に戻す。auto なら、ツールが不要なターンは文章で終えられる。any にすると、不要なターンでも何かのツールを呼ぶ。"}], "answer": ["D"]}, {"id": 13, "d": "D2", "task": "2.3", "scenario": "シナリオ6 構造化データ抽出", "q": "抽出の最初のリクエストでは必ず extract_metadata を呼び、その結果を見た次のターンで、enrich_vendor か lookup_contract か、エンリッチ不要ならツールなしの文章、のいずれかに進みます。いまは会話全体の tool_choice が any で、先にエンリッチメントツールが呼ばれることと、不要なのにツールが呼ばれることがあります。リクエストごとの設定はどれですか。", "multi": 1, "choices": [{"t": "全ターンをautoにし、最初は必ずextract_metadataとプロンプトに書く。後続で文章だけ終える点には合い、最初の順序は指示だけで足りるとみなしてよい。", "ok": false, "why": "後続を auto にすることは、不要なら文章で終える条件には合う。最初の順序をプロンプトだけにすると、今と同じ取り違えが残る。最初の1リクエストだけはツール名の強制が要る。"}, {"t": "全ターンをanyのままにする。どれかは必ず呼ばれ、最初がextract_metadataになるよう説明に順序を書く。不要な文書も、どれか1個を呼んでから終える。", "ok": false, "why": "any はツールの種類も順序も指定しない。説明文の順序は確率的で、今起きている先行呼び出しを止めない。不要な文書でもツールを強制するので、後半の条件にも合わない。"}, {"t": "最初のリクエストだけextract_metadataを強制する。次はautoへ戻し、道具を選ぶか、不要なら文章で終える。名前の強制は後続のターンへ持ち越さない。", "ok": true, "why": "最初に特定のツールが必要なら、そのリクエストだけ type tool で名前を指定する。tool_choice は会話に粘着しない。次のターンは、呼ばない選択肢が必要なので auto に戻す。any は何かのツールを強制するだけで、extract_metadata が先とは限らず、文章だけのターンもできない。"}, {"t": "後続もextract_metadataを強制し続ける。メタデータは会話に残るので、エンリッチは文章で書き、enrich_vendorやlookup_contractは呼ばない。", "ok": false, "why": "指定ツールの強制を後続まで残すと、そのターンは extract_metadata しか呼べない。エンリッチメントツールへ進むという後半の要件が成立しない。"}], "answer": ["C"]}, {"id": 14, "d": "D2", "task": "2.4", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "共有したい GitHub MCP は、リポジトリの .mcp.json に url と Authorization: Bearer ${GITHUB_TOKEN} でコミットしてあります。同じ名前 github の定義が、このリポジトリの local スコープにもあり、実験用モックを指しています。このリポジトリではモックに繋がります。個人の実験サーバはチームへ配りたくありません。トークンもコミットしたくありません。採る設定を2つ選んでください。", "multi": 2, "choices": [{"t": "このリポジトリのlocalのgithubを消す。あわせて同名ではlocalが.mcp.jsonより優先されるので、消せば共有定義とトークン展開が使われる。", "ok": true, "why": "同名のMCP定義は local、project、user の順で優先される。このリポジトリでモックに繋がるのは、local が .mcp.json を隠しているためである。local を消せば、トークンを環境変数展開にしたプロジェクト定義が使われる。"}, {"t": "userはprojectより優先されるので、モックをuserのgithubという名へ移せば、このリポジトリでもモックが勝つ。必ず展開はそのまま残してよい。", "ok": false, "why": "優先順位は逆で、user は project に勝たない。このリポジトリでモックが勝っているのは user ではなく local である。user の同名定義へ移すと、このリポジトリでは .mcp.json の方が使われる。"}, {"t": "共有定義は常にlocalに勝つので、原因は.mcp.json側にある。そのエントリを消し、各自のCLAUDE.mdへ同じurlを書けば全員が同じサーバを使う。", "ok": false, "why": "勝っているのは local の方であり、プロジェクト定義は local に勝たない。.mcp.json を消すと共有設定が無くなる。CLAUDE.md はどのスコープでもMCPサーバの定義としては読まれない。"}, {"t": "トークンを.mcp.jsonへ直書きし、ファイルごとgitignoreする。接続先はCLAUDE.mdに書き、実験用はpersonal: trueで同じファイルへ入れる。", "ok": false, "why": "ファイルごと無視するとチームにサーバが共有されない。トークン直書きは環境変数展開で避ける。CLAUDE.md は指示用で、MCPサーバの定義場所ではない。personal: true というフラグは無い。"}, {"t": "実験サーバはユーザースコープへ、github以外の名前で置く。あわせてuserはprojectに勝たない。別名なら共有名を隠さず、自分の環境だけで使える。", "ok": true, "why": "個人用・実験用はユーザースコープ（~/.claude.json）で、リポジトリには入らない。同名にすると優先順位の争いに巻き込まれる。user は project より弱いので、実験用を github という名前にしても、このリポジトリのモック上書きには使えない。別名が安全である。"}], "answer": ["A", "E"]}, {"id": 15, "d": "D2", "task": "2.5", "scenario": "シナリオ4 Claudeによる開発者の生産性向上", "q": "決済モジュールで、Edit が old_string「PAYMENT_DECLINED」に対して「一致が一意でない」で失敗しました。コード中の1か所だけを変え、コメント中の同じ語は残します。あわせて、index.ts が再エクスポートしているシンボルの、リポジトリ全体の呼び出し元を洗い出します。手順はどれですか。", "multi": 1, "choices": [{"t": "一意でないEditは、そのファイルをReadし、直した全文をWriteする。あわせて呼び出し元はバレルの公開名を列挙してから、名前ごとにGrepで集める。", "ok": true, "why": "Edit は一意な文字列の置換である。一意でないときは、そのファイルを Read し、直した全文を Write する。再エクスポート越しの使用箇所は、まず公開名を特定し、その名前で中身を Grep する。Glob はパスのパターンであり、識別子の出現検索には使わない。"}, {"t": "old_stringを関数全体まで伸ばしてEditをやり直し、失敗しても短い語を繰り返す。呼び出し元は全ファイルをReadし、Grepは使わず目視で集める。", "ok": false, "why": "一意になるまで周囲を足す編集は、失敗したあとのフォールバックとしてはガイドの手順ではない。全ファイルの Read はコンテキストを使い、バレルの公開名から Grep する手順を飛ばしている。"}, {"t": "Editをreplace_allでやり直し、コメントも含めて語を置換する。呼び出し元はGlobの**/*PAYMENT_DECLINED*で名前を集め、中身は探さない。", "ok": false, "why": "replace_all はコメント中の語まで変えるので、残すという条件に反する。Glob はファイル名とパスの一致であり、再エクスポートされた名前の出現はファイル名に含まれない。中身は Grep で探す。"}, {"t": "失敗したファイルはsedで語を一括置換する。呼び出し元はPAYMENT_DECLINEDだけをGrepし、バレルが別名で再エクスポートした名前は追わない。", "ok": false, "why": "sed の全置換はコメントも変え、一意でない Edit のフォールバックとしてファイル全体を書き戻す手順でもない。エラー文字列の検索は、バレル経由の別名の呼び出し元を漏らす。先にエクスポート名の一覧が要る。"}], "answer": ["A"]}, {"id": 16, "d": "D3", "task": "3.1", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "ルートの CLAUDE.md は金額を decimal と書いています。packages/billing/CLAUDE.md は float と書いています。チームの誰が請求ファイルを編集しても float を使います。Pythonだけの作業では float の指示は出ません。/compact のあと、会話中だけ伝えた「今日はテストを省略」は消え、ルートの規約は残ります。挙動の説明として正しいものはどれですか。", "multi": 1, "choices": [{"t": "規約の実体はsettings.jsonで、CLAUDE.mdは説明である。floatはsettingsを直し、一時指示もそこへ書けば/compactを越えて残る。下位のファイルは編集時に読まれない。", "ok": false, "why": "settings.json は振る舞いの文章を置く場所ではない。下位の CLAUDE.md は、そのディレクトリのファイルを扱うときにオンデマンドで読まれる。一時指示を settings へ書くと、今日だけではなくセッションを越えて残ってしまう。"}, {"t": "CLAUDE.mdは連結で、近いものが後から足される。請求ファイルのときだけ下位が読まれるので、floatはそのファイルを直す。/compactが戻すのはルートだけで、会話の指示は戻らない。", "ok": true, "why": "見つかった CLAUDE.md は上書きではなく連結され、ルートが先、作業に近いものが後である。サブディレクトリのファイルは、その配下を読むか編集するときだけ足される。だから請求ファイルのときだけ float が出る。直すのはそのファイルで、ルートを捨てると共通規約まで消える。/compact 後に再読込されるのはプロジェクトルートの CLAUDE.md で、会話だけで伝えた指示は残らない。"}, {"t": "全員に効くのはユーザのCLAUDE.mdで、プロジェクトより強い。floatは各人へそのファイルを配って揃える。/compactのあと、ルートも会話の指示も消える。ユーザの方が強い。", "ok": false, "why": "ユーザレベルの CLAUDE.md は本人の全プロジェクトにだけ効き、コミットでは共有されない。チーム全員の請求ファイルだけで起きる現象の原因にはならない。/compact 後もルートの CLAUDE.md は読み直される。"}, {"t": "近いCLAUDE.mdがルートを置き換えるので、ルートを消せばfloatだけ残る。/compactはすべて忘れる。今日だけの指示はsettings.jsonのrulesへ移せば残るとみなす。", "ok": false, "why": "連結であり置換ではない。ルートを消すと、請求以外の共通規約まで無くなる。settings.json は権限・フック・環境変数用で、文章の規約や「今日だけ」の指示の保存先ではない。/compact が忘れないのはルートの CLAUDE.md である。"}], "answer": ["B"]}, {"id": 17, "d": "D3", "task": "3.2", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "依存関係を調べるスキルは、既に context: fork です。メインの会話は中間出力で汚れていません。しかしスキル本文が「直前の会話で話題のパッケージを使え」と書いてあり、パッケージ名を渡していない呼び出しでは、的外れな一般論が返ります。フォークを外すと調査結果がメインへ戻ってきます。要件を満たす直し方はどれですか。", "multi": 1, "choices": [{"t": "forkを削除し、直前の会話を使えという文は残す。履歴が見えれば引数は不要になる。中間出力はメインへ戻るが、調査の精度を優先する。メインが埋まる。", "ok": false, "why": "履歴が見えないのは fork の仕様で、不具合ではない。fork を外すと、このスキルが分離したかった長い中間出力がメインのコンテキストへ戻る。必要な入力は引数として渡す。"}, {"t": "forkを消し、allowed-toolsをReadとGrepだけにする。道具が少なければメインは汚れず履歴も見えるので、パッケージ名の引数は不要になるとみなす。", "ok": false, "why": "allowed-tools はスキル実行中に使えるツールの範囲（試験ガイド上の制限）であり、出力を別コンテキストへ隔離する設定ではない。Read と Grep だけでも調査ログは長く、fork を外した会話を埋める。履歴参照を残す限り、引数が無い呼び出しは不安定なままである。"}, {"t": "本文をルートのCLAUDE.mdへ移し、毎回の会話に手順を載せる。forkは削除する。パッケージ名はそこに決め打ちし、呼び出しごとの引数は作らない。", "ok": false, "why": "CLAUDE.md は常時読み込まれる場所で、調査のたびにだけ要る手順を常駐させるとトークンを使い続ける。パッケージ名の決め打ちでは、呼び出しごとの対象を渡せない。コンテキストの分離も無くなる。"}, {"t": "forkは維持する。会話参照を消し、argument-hintと引数でパッケージ名を受け、手順はその入力だけで完結させる。フォークされたスキルは親の履歴を見ない。", "ok": true, "why": "context: fork は分離したサブエージェントで動き、親の会話履歴は見えない。だから「直前の会話」は参照できず、指示は自己完結でなければならない。パッケージ名は引数で渡す。fork を外すと履歴は見えるが、分離したかった中間出力がメインへ戻る。"}], "answer": ["D"]}, {"id": 18, "d": "D3", "task": "3.3", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "Terraform の規約は .claude/rules/terraform.md にあります。フロントマターは無く、Python だけを編集するセッションでもこの規約が読まれてトークンを使います。.tf は infra/、services/*/deploy/、modules/ に散らばっています。.tf を読むか編集するときだけ規約を読み、他の作業では読ませたくありません。保守しやすい方法はどれですか。", "multi": 1, "choices": [{"t": "フロントマターへglobsの**/*.tfを書く。GitHubと同じキーなので.tfのときだけ読まれ、Pythonでは外れる。pathsというキーは使わない。", "ok": false, "why": "ルールファイルのフロントマターで読まれるキーは paths だけである。globs は無視され、フロントマターが条件として効かないので、今どおり常時読み込まれる。"}, {"t": "ルートのCLAUDE.mdからrulesをインポートし、rules側は今のままにする。インポートは参照のときだけ展開され、.tf以外ではトークンを使わないとする。", "ok": false, "why": "ルートからインポートした内容は、ルートの CLAUDE.md とともに起動時から会話に入る。インポートはファイルの整理にはなるが、コンテキスト量も読み込み条件も減らさない。paths が無いルールは常時のままである。"}, {"t": "同じrulesファイルへpathsのグロブ**/*.tfを付ける。そしてpathsが無いルールは起動時から常に読まれる。別キーのglobsでは条件にならない。", "ok": true, "why": "rules のフロントマターで効くのは paths だけである。グロブに一致するファイルを Read、Write、Edit したときだけ読まれる。paths が無いルールは、プロジェクトの CLAUDE.md と同様に起動時から常時入る。散在する拡張子には、ディレクトリごとの複製よりこのグロブが合う。"}, {"t": "infra、deploy、modulesの各所へCLAUDE.mdを置き、同じ文をコピーする。rulesは消す。ディレクトリ単位なら、それだけで条件付きになるとみなす。", "ok": false, "why": "ディレクトリの CLAUDE.md は、その木の中を扱うときに読まれるが、同じ文面を複数箇所へ複製することになる。ファイルがさらに別のディレクトリへ増えるたびにコピーが要り、散在する拡張子の指定としては paths の方が保守しやすい。"}], "answer": ["C"]}, {"id": 19, "d": "D3", "task": "3.4", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "今夜のリリースに間に合わせたいのは、本番のスタックトレースが OrderService.applyDiscount の null 参照を指している1関数の修正だけです。呼び出し元は12ファイルあります。同じチケットの後半には、来週、注文処理を別サービスへ切り出し、連携を Webhook にするかキューにするかを決めて実装する、とあります。今夜の進め方はどれですか。", "multi": 1, "choices": [{"t": "今夜はスタックが指す1関数だけを直接実行する。呼び出しが12あっても差分がガードに閉じるなら計画には入らない。切り出しと連携の方式は来週、計画モードで選ぶ。", "ok": true, "why": "範囲が明確で、スタックトレースのある単一関数の修正は直接実行である。呼び出し元の数は、今夜の差分が広がることの根拠にはならない。連携方式が複数ありインフラも違う切り出しは、計画モードの対象だが、今夜の作業ではない。複雑さがチケットに書いてある作業を、直接実行で先に始めない。"}, {"t": "切り出しとあるので今夜から計画モードで全体を設計し、null修正は承認後に入れる。直接実行では、12の呼び出し元を必ず見落とすとみなして先に計画モードへ入る。", "ok": false, "why": "計画モードが必要なのは、来週の方式選択である。今夜の欠陥は原因と修正箇所がスタックで特定されている。計画の承認を待つと、閉じた修正まで遅れる。12の呼び出し元は、ガードを1関数に置くことを妨げない。"}, {"t": "今夜はExploreで切り出しだけ調べ、null修正はそのあと計画モードへ入れる。呼び出し元が複数ある1関数でも、計画の承認が先に要るとみなす。", "ok": false, "why": "冗長な調査を Explore へ分離すること自体は、コンテキストを汚さない手段である。しかし今夜必要なのは調査レポートではなく、特定済みの1関数の修正で、それは直接実行できる。計画モードの承認をその修正の前提にしない。"}, {"t": "null修正と切り出しを、長い指示のまま直接実行する。Webhookかキューかは実装しながら決め、計画モードは途中で行き詰まったときだけ使う。", "ok": false, "why": "方式が複数でインフラ要件も違う作業を、コードを調べる前の長文指示と直接実行で進めるのは、正しい構成を最初から知っている前提になる。行き詰まりを見てから計画モードへ移すのは、複雑さが最初から分かっている依頼では手戻りになる。"}], "answer": ["A"]}, {"id": 20, "d": "D3", "task": "3.5", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "日付関数は「03/11/2026」や「2026年11月3日 午後2時」の解釈が、説明文を足しても実行のたびに変わります。この関数のタイムゾーン仮定を変えると、移行スクリプトが期待するタイムスタンプも変わります。null の扱いは別関数の欠陥で、日付の解釈とは独立です。直し方はどれですか。", "multi": 1, "choices": [{"t": "実装前にインタビューで方針を質問させ、例は作らない。三つは別ターンにし、計画モードのあとで直接実行へ移してから直す。", "ok": false, "why": "インタビューは、不慣れな領域で実装前に考慮点を洗い出すときに使う。今回は形式の解釈が毎回割れているので、最初の手段は入出力例である。単一関数の仕様の揺れに、計画モードは要らない。"}, {"t": "日付と移行の期待値は1メッセージにし、曖昧な形式の入出力例を付ける。独立したnullは別ターンで、失敗する具体例を渡して直す。", "ok": true, "why": "文章にしても解釈が割れ続ける変換は、具体的な入力と期待出力の例が効く。互いに影響する修正は1メッセージにまとめ、独立した欠陥は順に別ターンで扱う。null まで同じメッセージへ混ぜると、独立な失敗の判定が日付の変更と絡む。"}, {"t": "三つを別ターンにし、日付は説明を長くして例は付けない。移行は後から期待値の文章だけで追従させ、入出力の組は作らない。", "ok": false, "why": "解釈が割れる変換に、同じ文章の手段を長くしても安定しない。必要なのは曖昧な形式を含む入出力例である。影響し合う日付と移行期待値を別ターンに割ると、片方だけが新しい仮定で進む。"}, {"t": "日付、移行、nullを、例つきの1メッセージにまとめる。独立かは分けず、一度に渡した方が取りこぼしは少ないとみなして同時に直す。", "ok": false, "why": "例を付ける点は日付の揺れには合う。しかし null は日付と独立なので、影響し合う組とは別のターンに分ける。全部を1メッセージにすると、どの失敗がどの変更で直るのかが同時に動く。"}], "answer": ["B"]}, {"id": 21, "d": "D3", "task": "3.6", "scenario": "シナリオ5 継続的インテグレーションのためのClaude Code", "q": "CIのレビューは claude -p と --output-format json で動いており、入力待ちで止まることはありません。投稿スクリプトは自由文を解析しており、指摘のファイルと行の取り違えがあります。開発者が修正を積むたびに、対応済みの指摘が重複して付きます。フラグとプロンプトの組み合わせはどれですか。", "multi": 1, "choices": [{"t": "--json-schemaで構造化する。再実行前にボットコメントをすべて消し、全文を投稿し直す。前回の指摘本文はプロンプトへ渡さず、履歴も残さず消してしまう。", "ok": false, "why": "スキーマは投稿の取り違えには効く。コメントの全削除は議論の履歴を消し、モデルは前回何を指摘し、どれが未対応かを知らないまま同じ指摘を再投稿する。"}, {"t": "フラグは今のまま、最初のコミットだけレビューし、以降は走らせない。重複は起きないので、前回指摘を渡す処理もスキーマも不要だとみなす。後続コミットは見ない。", "ok": false, "why": "最初のコミット以降に入った欠陥を見なくなる。重複の原因は再実行そのものではなく、前回の指摘を入力に入れていないことである。自由文パーサの取り違えも残る。"}, {"t": "-pを外しCLAUDE_HEADLESSと--batchを付ける。あわせて前回指摘は渡すが、出力は自由文のままでスキーマは付けない。存在しないフラグを停止の代わりにする。", "ok": false, "why": "CLAUDE_HEADLESS と --batch は存在せず、-p の代わりにならない。-p を外すと、非対話で終了するという今満たしている条件が落ちる。前回指摘を渡す点だけは重複に効くが、自由文の取り違えは残る。"}, {"t": "-pとjsonは維持し、--json-schemaでstructured_outputを取る。再実行時は前回の指摘を含め、新規か未対応だけ報告する。無いフラグは足さない。", "ok": true, "why": "非対話は既に -p で満たしている。機械が投稿するなら、自由文ではなく --json-schema の structured_output を読む。重複は、前回の指摘を知らないことが原因なので、その一覧を渡して新規と未対応だけに限定する。CLAUDE_HEADLESS や --batch は存在しない。"}], "answer": ["D"]}, {"id": 22, "d": "D4", "task": "4.1", "scenario": "シナリオ5 継続的インテグレーションのためのClaude Code", "q": "レビュープロンプトには、報告するカテゴリ（欠陥とセキュリティ）と報告しないカテゴリ（命名の趣味、局所的なコメント）を既に書いてあります。それでも命名の誤検知が多く、開発者は欠陥の指摘まで無視し始めています。high と medium の付け方も、同じ種の欠陥で実行のたびに変わります。「確信度が高いものだけ報告」とも書いてあります。次の修正はどれですか。", "multi": 1, "choices": [{"t": "さらに保守的に、迷う指摘は出すなと足す。命名も欠陥も残し、重大度はhighを既定にする。レベルごとのコード例は定義しないままにする。", "ok": false, "why": "「保守的に」は、カテゴリごとの具体的な基準より効かない、と分かっている種類の指示である。命名の誤検知を止めず、迷った本物の欠陥まで落とす。重大度の既定値は、同じ欠陥が medium になったり high になったりの揺れを説明しない。"}, {"t": "命名は残し、0から1の自己申告で0.9未満を捨てる。重大度の例は足さず、確信度が高いという文を数値のしきい値へ置き換えたとみなす。", "ok": false, "why": "自己申告の確信度は校正されておらず、閾値にすると欠陥も命名も同じように落ちる。命名を残す限り、その誤検知が他の指摘への不信を広げ続ける。重大度の揺れにも例が無い。"}, {"t": "命名は直すまで外し、欠陥とセキュリティは残す。重大度はレベルごとに出す例と出さない例を足す。自己申告の点数へは切り替えない。", "ok": true, "why": "誤検知の多いカテゴリは、正確なカテゴリへの信頼まで壊すので、基準を直す間は外す。重大度が割れるのは、レベルごとの具体的なコード例が無いからである。「確信度が高いものだけ」という一般指示は、カテゴリ基準の代わりにならない。モデルが自分で付けた点数も、そのままでは閾値に使えない。"}, {"t": "同じ差分を3回見て、3回とも出た指摘だけ投稿する。命名も残し、1回だけのものは誤検知として捨てる。重大度の具体例は足さない。", "ok": false, "why": "再現しない本物の欠陥まで、誤検知といっしょに捨てる。命名カテゴリを残したまま件数が減るだけで、そのカテゴリが信頼を壊す構造は残る。重大度の一貫性にも効かない。"}], "answer": ["C"]}, {"id": 23, "d": "D4", "task": "4.2", "scenario": "シナリオ6 構造化データ抽出", "q": "論文から引用文献を抜くツールの説明と指示文は、項目の定義と null にしてよい条件まで既に長いです。それでも、本文中のインライン引用だけの論文と、方法が本文に埋め込まれた論文では、必須のはずの項目が null になります。参考文献リストが独立している論文では取れています。ツールの選択先を間違える現象は起きていません。次の一手はどれですか。", "multi": 1, "choices": [{"t": "インライン、独立リスト、本文埋め込み、記載が本当に無い形について、どこから取りいつnullにするかの例を足す。必須化して埋めさせることはしない。", "ok": true, "why": "指示が長いのに文書の形で結果が割れるときは、形ごとの few-shot が効く。例には、なぜその値を採り、もっともらしい別の欄を採らなかったかを含める。本当に記載が無い形も見せないと、null を埋める方向へ寄る。選択先は間違っていないので、説明をさらに伸ばすのはこの失敗の一手ではない。"}, {"t": "説明が短いとみなし、構造の箇条書きをさらに足す。例はトークンが増えるだけで根本ではないので足さない。選択ミスではない点は見ない。", "ok": false, "why": "説明と指示は既に長く、失敗はツールの選び間違いではない。構造の列挙を文章で増やしても、どこから抜きどこを null にするかの実例が無いと、未知のレイアウトへ汎化しにくい。例が後回しになるのは、説明不足が原因のツール選択のときである。"}, {"t": "同じ指示で最大5回やり直し、nullが消えた回を採用する。形の例は足さず、文書構造の違いを指示へも書かないまま回数だけで揃える。", "ok": false, "why": "入力の形への対応を変えない再実行は、同じ欠落を繰り返しやすい。独立した文献リストでは既に取れており、失敗は乱数ではなく、見ていない構造があることである。"}, {"t": "nullの項目を必須にして禁止する。必ずインライン引用では、近傍の文からもっともらしい値を補って埋める、と指示に足し、空欄はエラーとして落とす。", "ok": false, "why": "必須化は、記載が本当に無い論文で値の創作を誘う。インライン引用から取る方法がモデルに伝わっていないのが失敗で、禁止しても取り方は増えない。"}], "answer": ["A"]}, {"id": 24, "d": "D4", "task": "4.3", "scenario": "シナリオ6 構造化データ抽出", "q": "請求書抽出のスキーマを strict のツール入力にします。発注番号が無い請求書が約3割あります。費目は software、hardware、maintenance が大半ですが、新しい費目と、どちらとも言えない記載が混じります。明細合計と請求総額が食い違う請求書もあります。スキーマと指示の組として適切なものを2つ選んでください。", "multi": 2, "choices": [{"t": "stated_totalへminimumとmaximumを書き、合計と一致する範囲だけ許す。strictなら範囲指定が意味の一致まで保証するので、別検証は置かない。", "ok": false, "why": "現行の構造化出力は、数値の minimum や maximum を制約として強制しない。仮に範囲を見ても、二つの金額フィールドの一致は、片方のフィールドの範囲ではない。strict が除くのはスキーマに反する構文で、合計不一致のような意味のエラーは残る。"}, {"t": "categoryはenumをやめ、自由な文字列だけにする。新しい費目を落とさないため、otherもunclearも詳細欄も作らず、名寄せは下流へ任せる。", "ok": false, "why": "未知の費目への逃げ道は、自由記述へ全部開くことではなく、other と詳細文字列である。曖昧な記載には unclear を用意する。名寄せを下流へ丸投げすると、表記ゆれがそのまますべて通過する。"}, {"t": "po_numberはnullを許し、記載が無いときはnullと書く。必ず文脈から番号を推測して埋めてはならない。欠ける3割を必須の文字列にはしない。", "ok": true, "why": "ソースに無いかもしれない値を必須にすると、モデルはもっともらしい番号を作る。null を許す型と、無いときは null、という指示を組にする。推測で埋める指示は、欠落を成功に見せる。"}, {"t": "categoryは既定の3種にotherとunclearを足したenumにし、その2つのときはcategory_detailへ記載を入れる。自由記述だけにはしない。", "ok": true, "why": "閉じた enum だけだと新しい費目が入らない。other に加えて、判断できない記載用の unclear と、中身を残す詳細文字列を置く。自由記述だけにすると、集計と下流の突き合わせで表記が割れる。"}, {"t": "po_numberは必須にし、無いときは顧客名と日付から最も近い番号を推定する。それに加えて、nullは検証で落ちるので使わせず、推測で毎回埋める。", "ok": false, "why": "3割で記載が無い項目の必須化は、推定という名の創作を設計に組み込む。検証で弾く対象は、ソースに無いことではなく、形式や合計の矛盾である。"}], "answer": ["C", "D"]}, {"id": 25, "d": "D4", "task": "4.4", "scenario": "シナリオ6 構造化データ抽出", "q": "契約抽出は strict のツール入力で、契約日も契約番号も type string です。検証で二つ落ちました。(a) 契約日が「2026/11/03」で、アプリ側が要求する 2026-11-03 ではない。strict はこの文字列を受け入れています。(b) 契約番号は本文に無く、今回入力していない別添付にだけあります。それぞれの扱いはどれですか。", "multi": 1, "choices": [{"t": "(a)はstrictが受理したので検証を外して採用する。(b)だけ、添付が無くても顧客名からそれらしい番号を推定する再試行を許す。", "ok": false, "why": "役割が逆である。(a) はソースに日付があり、形式だけが違うので、検証文つきの再試行で直せる。(b) の推定は、入力に無い値を作る。strict の受理は、(a) を正しいISOだと保証しない。"}, {"t": "(a)は契約と失敗結果と検証文を添えて再試行し、形式を直させる。(b)は再試行せずnullのまま人間へ回すか添付を入手する。番号は推測しない。", "ok": true, "why": "文字列型の strict は、スラッシュ区切りを構文エラーにしない。形式の不一致は、元文書と失敗結果と具体的な検証エラーを渡す再試行で直る。ソースに無い番号は、再試行を重ねても正しい値は出てこず、推測は創作になる。null と人間の確認、または資料の入手に分ける。"}, {"t": "(a)も(b)も検証文なしで同じプロンプトを再実行する。strictが受理したので、実行のばらつきだけでスラッシュ形式も直るとみなす。", "ok": false, "why": "何が検証に落ちたかを渡さない再実行は、修正の手がかりが無い。strict が受け入れたことは、ISOの形式が正しいことの証明ではない。文字列型は表記を制約しない。"}, {"t": "(a)も(b)も検証文つきで3回まで再試行し、最後を採用する。そのうえで添付が無いことは伝えず、番号はやり直しの過程で本文から補えるとみなす。", "ok": false, "why": "(a) の再試行は材料が揃うので効く。(b) は入力に番号が無いので、回数を増やしても検証文から番号は復元できない。最後の値を採用すると、創作した番号が通過し得る。"}], "answer": ["B"]}, {"id": 26, "d": "D4", "task": "4.5", "scenario": "シナリオ6 構造化データ抽出", "q": "請求書は一日中ばらばらに届き、到着から32時間以内に抽出結果を下流へ渡す必要があります。Message Batches API は費用が半分で、処理ウィンドウは最大24時間、レイテンシの保証はありません。抽出の前に、仕入先IDを同期のツールで1往復だけ確認します。失敗した請求書だけ送り直したいです。方針はどれですか。", "multi": 1, "choices": [{"t": "確認は投入前に済ませ、12時間ごとに送る。必ず失敗分はcustom_idで再送する。12と24で36時間になるが、費用が半分なので期限の超過を許容する。", "ok": false, "why": "再送の単位と、ツールをバッチの外に出す点は合う。12時間待ちに24時間の処理を足すと最大36時間で、32時間の期限を超える。費用の割引は、その期限を緩める理由にならない。"}, {"t": "夜間に1回送り、往復はバッチの中で行う。結果は投入順に並ぶとして位置で失敗を特定する。custom_idは使わず、待ちは最大で1日分になる。", "ok": false, "why": "1日1回は待ちが最大24時間で、処理の最大24時間と足すと48時間になる。バッチ内のツール往復もできず、結果の順序も前提にできない。特定は custom_id で行う。"}, {"t": "確認も同じバッチリクエストの中で行う。送信は4時間ごとなので計算上は期限内である。失敗時はバッチ全体を、同じ順で入力の順のままもう一度送る。", "ok": false, "why": "4時間間隔自体は期限の計算上は収まる。しかし1リクエストの中のマルチターンのツール呼び出しは、バッチではできない。結果の順も保証されないので、全体を順に送り直す対応は、失敗した請求書と結果を結べない。"}, {"t": "確認はバッチ前に同期で終える。抽出は8時間ごとに送り、失敗分だけcustom_idで再送する。待ち8時間と処理24時間の和は、32時間の期限内に収まる。", "ok": true, "why": "待ちの最大と、保証できない処理ウィンドウ最大24時間の和が、32時間の期限内に収まる間隔が要る。8時間なら最大32時間で一致する。バッチの1リクエストの中ではツール往復ができないので、確認は投入前の同期で終える。結果の順序は保証されないため、対応と再送は custom_id で行う。"}], "answer": ["D"]}, {"id": 27, "d": "D4", "task": "4.6", "scenario": "シナリオ5 継続的インテグレーションのためのClaude Code", "q": "CIは、テストコードを生成した同じセッションで「今の変更を厳しくレビューして」と続けています。40ファイルのPRで、ファイル内の欠陥と、ファイルをまたぐデータフローの矛盾の両方が、このレビューを通過しています。生成時の拡張思考は有効です。レビューの構成はどれですか。", "multi": 1, "choices": [{"t": "生成セッションのままファイルごとに見、最後に同じセッションで横断を足す。インスタンスは分けない。生成の記憶が指摘を具体的にする。", "ok": false, "why": "パスを二つに分ける点は、注意の分散には合う。しかし生成を見たセッションのままなので、自分の判断を維持するセルフレビューの限界は残る。具体さの材料は、生成時の推論ではなく、差分そのものを独立側へ渡せば足りる。"}, {"t": "同じセッションに役割の文を足して2回繰り返す。2回目は1回目を疑うと書く。ファイルごとと横断への分割はせず、一続きのまま読む。", "ok": false, "why": "役割を変えても生成時の推論は同じセッションに残る。同じ偏りで2回読むことになり、パスを分けないので40ファイルの横断矛盾は引き続き注意の外に落ちやすい。"}, {"t": "生成とは別インスタンスで見る。ファイルごとのパスと横断パスを分ける。同じセッションの拡張思考や役割の宣言は、分離の代わりにしない。", "ok": true, "why": "同じセッションは生成時の推論を持ったままなので、自分の判断を疑いにくい。拡張思考や役割の宣言を足しても、そのコンテキストは残る。40ファイルを1パスにすると注意が分散するので、ファイル単位のパスと横断パスを分ける。分ける場所は、生成を見ていないインスタンスである。"}, {"t": "同じ生成セッションで拡張思考のまま、レビューを1パス足す。別インスタンスは重いので、思考を長くして横断の見落としを補えば足りるとする。", "ok": false, "why": "独立したレビューインスタンスの方が、同じセッションの拡張思考より、微妙な欠陥を見つける。1パスのままでは、ファイル内と横断の注意が同時に薄くなる。"}], "answer": ["C"]}, {"id": 28, "d": "D5", "task": "5.1", "scenario": "シナリオ1 カスタマーサポート解決エージェント", "q": "長い会話では古いターンが要約されます。「注文A-1029は $127.50 を11月20日までに返金する」が、「返金は対応中」になります。注文ツールは40項目を返しますが、使うのは金額・日付・状態を含む5項目で、その金額は長い結果の中ほどに一度だけ出ていました。要約の間隔を短くする変更は、すでに試して悪化しています。保持の方法はどれですか。", "multi": 1, "choices": [{"t": "金額・日付・注文番号・約束は、要約の外のケース事実として毎ターン入れる。ツール結果は積む前に5項目へ削り、集約するときの主要事実は先頭に置く。", "ok": true, "why": "段階的な要約は、金額・日付・顧客への約束を曖昧にする。それらは要約の外へ構造化して、毎ターンのプロンプトに含める。40項目の結果は、履歴に積む前に必要な欄だけへ削る。長い入力の中ほどは見落とされやすいので、主要事実は先頭にまとめる。要約の頻度を上げると、劣化する回数だけが増える。"}, {"t": "履歴の末尾へ毎ターン、重要なら覚えてと1行足し、金額の再掲はしない。結果は削らず、古いツール結果が自動で正確な数値へ置き換わると期待する。", "ok": false, "why": "末尾への注意書きは、要約がすでに曖昧にした数値を復元しない。古いツール結果をクリアする機能があっても、消えた中ほどの金額を正確なケース事実へ書き戻すわけではない。積む前に欄を削り、事実は要約の外へ置く。"}, {"t": "返金の話題のたびに、顧客へ番号と金額と日付を言い直してもらい、その発話を最新として残す。内部にケース事実は持たず、再発話を正本にする。", "ok": false, "why": "保持できる事実を、顧客への再質問で取り直している。体験を悪くし、すでに約束した内容が会話の外に無い状態は変わらない。正本は、要約されない構造化したケース事実である。"}, {"t": "要約の間隔をさらに短くし、金額と日付はシステムプロンプトの中央に1行で固定する。ツール結果は40項目のまま積み、ケース事実のブロックは作らない。", "ok": false, "why": "要約を細かくするほど、数値や日付が一般化される機会が増える。すでに間隔を短くして悪化している。長いプロンプトの中央は、先頭と末尾より見落とされやすい位置である。40項目を積み続けると、必要な5項目が中ほどに埋もれたままになる。"}], "answer": ["A"]}, {"id": 29, "d": "D5", "task": "5.2", "scenario": "シナリオ1 カスタマーサポート解決エージェント", "q": "顧客は配送遅延に怒っていますが、人間への取次は求めていません。遅れの再配送は、エージェントが手順どおり実行できます。同じメッセージで「競合店の価格に合わせてほしい」とも頼んでいます。ポリシーは自社サイトに掲載した価格の訂正だけを定めており、競合との合わせは書かれていません。このメッセージへの対応はどれですか。", "multi": 1, "choices": [{"t": "怒りが強いので再配送も価格も着手せず、両方を直ちに担当者へ渡す。人間という語が無くても、不満の強さを取次の要求だとみなして全体を渡す。", "ok": false, "why": "人間を求める発話と、解決できる件への不満は違う。再配送まで渡すと、自分で完了できる用件の初回解決を落とす。強さは、ケースの複雑さや要求の代替指標にならない。"}, {"t": "遅延は受け止めて再配送を自分で終える。競合価格は規定が無いのでその件だけ渡す。怒りで両方を渡すことと、両方を自分で決めることはしない。", "ok": true, "why": "明示的に人間を求めていない、解決できる不満は、受け止めて解決を申し出る。重ねて人間を希望したときにエスカレーションする。ポリシーが触れていない例外は、実行可能に見えても自分で決めない。用件ごとに分け、怒りや感情の強さでは振り分けない。"}, {"t": "感情スコアが閾値を超えたら両方を人へ渡し、超えなければ価格も含め両方を自動で行う。スコアの上下を、ポリシーの有無より先に使う。", "ok": false, "why": "感情分析は、実際の複雑さや顧客の要求の指標として使わない。閾値の上下で、解決できる再配送と、ポリシーの空白である価格合わせを同じ側へ束ねてしまう。"}, {"t": "人間という語が無いので、再配送も競合価格も自分で実行する。ポリシーに競合が無いことは禁止ではないので、沈黙を許可として扱ってよい。", "ok": false, "why": "再配送を自分で終える点は合う。競合への合わせは、自社サイトの訂正しか書いていないポリシーの空白であり、沈黙を許可にはしない。この用件はエスカレーションする。"}], "answer": ["B"]}, {"id": 30, "d": "D5", "task": "5.4", "scenario": "シナリオ4 Claudeによる開発者の生産性向上", "q": "数時間の探索のあと、Claude は以前特定した LegacyInvoiceAdapter ではなく「この種のコードは一般にこうです」と答え、同じ質問への答えも揺れています。発見は会話の中だけに書いてあり、昨日のクラッシュでその会話は落ちました。再開用のファイルはまだありません。コンテキストの扱いとして正しいものはどれですか。", "multi": 1, "choices": [{"t": "compactにクラス名を残せと付けて同じ会話を詰め、ファイルは作らない。委任は全体を見てという広い指示のまま、正本は詰めた会話の再開だけにはする。", "ok": false, "why": "compact は会話を要約する操作で、すでに一般論へ落ちた具体名を、ファイルに無い状態から正確には戻せない。広い委任は長い出力をメインへ戻し、劣化を再発させる。クラッシュの正本は、要約済み会話ではなく、既知パスへ出した状態である。"}, {"t": "劣化した会話をforkし、一方で探索、他方で実装する。forkはファイルを読み直すので、スクラッチパッドもマニフェストも不要になるとみなす。", "ok": false, "why": "fork は会話の分岐で、劣化した履歴の具体名を修復しない。両方の枝が、一般論に戻ったコンテキストを起点にする。ファイルの再読込や状態の書き出しの代わりにはならない。"}, {"t": "会話を捨てて空で始め、クラス名は劣化の一部なので注入しない。探索はメインのままで、サブエージェントもスクラッチパッドも使わないまま。", "ok": false, "why": "空の開始は、まだファイルに残していない発見まで捨てる。新しく始めるときも、残せる構造化メモを注入する。メインで広い探索を続けると、同じ劣化が短い時間で戻る。"}, {"t": "具体名はスクラッチパッドのファイルへ書き、以降はそこを参照させる。探索は特定の問いだけ委任し、落ちたときは既知パスのマニフェストをプロンプトへ戻す。", "ok": true, "why": "長い探索で具体名が一般論に戻るのは、コンテキストの劣化である。発見はファイルに残して以降の質問から参照する。冗長な探索は、問いを特定したサブエージェントへ渡し、メインは調整に留める。クラッシュに備えて、各エージェントが既知の場所へ状態を出し、再開時はコーディネーターがそのマニフェストを読んでプロンプトへ入れる。"}], "answer": ["D"]}, {"id": 31, "d": "D5", "task": "5.5", "scenario": "シナリオ6 構造化データ抽出", "q": "請求書・領収書・契約の抽出は、全体で精度97%です。件数の4%しかない契約の特約欄だけは61%です。人間のレビューをやめ、モデルが自分で付ける確信度 0.9 以上を自動承認にしたい、という提案があります。この 0.9 はラベル付きの検証セットでは調整していません。高確信度と判定された抽出の抜き取り検査も、まだありません。進める判断はどれですか。", "multi": 1, "choices": [{"t": "文書に一つの点数を出させ、その文書スコアだけを校正する。欄の点数は作らず、文書が閾値以上なら特約欄もまとめて自動承認する。", "ok": false, "why": "校正の手順自体は必要だが、単位が文書全体だと、特約欄の61%が他欄の正しさに埋まる。閾値で振り分ける確信度はフィールド単位で、ラベル付きセットに対して校正する。"}, {"t": "全件の1%を単純に抜き、問題が無ければレビューをやめる。層は切らない。0.9は、その1%の誤りが少なければ校正なしで採用してよい。", "ok": false, "why": "4%しかない契約が、1%の単純無作為に十分入るとは限らない。特約欄の誤りは、文書単位の抽出ではさらに薄まる。層を切らないサンプルは、低い欄を見逃したままレビュー廃止の根拠にされる。"}, {"t": "種別と欄に精度を分け、低い特約が見えてから範囲を決める。高確信度側も層化抽出で測る。閾値はラベル付きセットで欄ごとに校正してから置く。", "ok": true, "why": "全体の97%は、件数の少ない種別や欄の低さを隠す。レビューを減らす前に、種別とフィールドで一貫した性能を確認する。高確信度の帯も層化無作為抽出で測らないと、新しい誤りの型を見逃す。モデル自身の 0.9 は、ラベル付きセットで欄ごとに校正する前の閾値にはしない。"}, {"t": "全体97%なので、自己申告0.9以上を今日から自動承認し、レビューは残さない。特約は件数が少ないので、全体の数字に含めて十分だとみなす。", "ok": false, "why": "件数の少ない欄の61%は、全体の97%からは見えない。校正していない自己申告は、その欄でも高い点数を出し得る。自動化の前に、欄ごとの確認と、高確信度側の継続測定が無い。"}], "answer": ["C"]}, {"id": 32, "d": "D5", "task": "5.6", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "市場規模について、A社レポートは「120億ドル、データは2023年、対象は直販のみ」、業界団体は「165億ドル、データは2025年、対象は直販とチャネル」です。文書分析サブエージェントは新しい165億だけを残そうとしています。金額は報告書では文章の一文に溶かす予定です。統合の扱いとして正しいものはどれですか。", "multi": 1, "choices": [{"t": "両方を出典・時期・対象つきで残し、分析側は勝者を選ばない。時期の見方と表での併記はコーディネーターが行う。確立と対立は節を分ける。", "ok": true, "why": "信頼できる情報源の数値が違うとき、分析サブエージェントは矛盾を残したまま終える。どちらを採るかはコーディネーターが、出典・時期・方法を見たうえで判断する。時期が違えば単純な矛盾ではないが、古い方を捨てる理由にも、平均を作る理由にもならない。財務の数値は文章に溶かさず表にし、確立した知見と割れている知見は節を分ける。"}, {"t": "平均の約142.5億を市場規模とし、出典は両方書く。時期と対象の差は注記するが、表にはせず、一文の中だけに数字だけを置く。", "ok": false, "why": "どちらの情報源も示していない数値を作っている。出典を併記しても、平均は観測ではない。時期と対象が違う値は、同じ列の一つの数へ潰さず、条件つきで両方を残す。"}, {"t": "時期が違うので矛盾ではない。120億は消し、165億だけを出典なしの一文にする。直販のみかチャネルを含むかの差は、注記しないままにする。", "ok": false, "why": "時期を構造化して持つのは、時期の違いを矛盾と誤認しないためで、古い値の削除許可ではない。対象範囲も違うので、新しい方だけを市場規模そのものとして書くと、定義の違う数値が一つに見える。出典も落ちている。"}, {"t": "分析側が165億を採り、120億は解消済みとして落とす。コーディネーターは採用値だけ受け、財務もニュースと同じ文章で書いてよい。", "ok": false, "why": "矛盾の解消を文書分析側が行うと、コーディネーターが時期と対象を見て判断する余地が無くなる。財務データをニュースと同じ文章へ揃えると、二つの定義の比較ができなくなる。数値は表が合う。"}], "answer": ["A"]}], "domains": {"D1": "分野1 エージェントアーキテクチャとオーケストレーション（Agentic Architecture & Orchestration）", "D2": "分野2     card.append(el("div",{class:"qtext",text:it.q}));
    const box=el("div");
    it.choices.forEach((c,i)=>{
      const inp=el("input",{type:it.multi>1?"checkbox":"radio",name:"q"+it.id,value:String(i)});
      const lab=el("label",{class:"choice"},inp,el("span",{class:"letter",text:L[i]+"."}),el("span",{text:c.t}));
      inp.addEventListener("change",()=>{ if(st.checked[it.id]) return; let s=st.sel[it.id]||[]; if(it.multi>1){ s=inp.checked?[...new Set([...s,i])]:s.filter(x=>x!==i); } else { s=[i]; } st.sel[it.id]=s; if(!st.start) st.start=Date.now(); save(); update(it); });
      box.append(lab);
    });
    card.append(box);
    const btn=el("button",{class:"primary",text:"答え合わせ"}); btn.dataset.role="check";
    btn.addEventListener("click",()=>{ st.checked[it.id]=true; save(); update(it); updateHeader(); });
    const redo=el("button",{text:"やり直す"}); redo.dataset.role="redo";
    redo.addEventListener("click",()=>{ delete st.checked[it.id]; delete st.sel[it.id]; save(); update(it); updateHeader(); });
    card.append(el("div",{class:"actions"},btn,redo,el("span",{class:"verdict"})));
    card.append(el("div",{class:"exp",hidden:""}));
    qs.append(card);
    update(it);
  }
  updateHeader();
}
function update(it){
  const card=document.getElementById("q"+it.id);
  const sel=st.sel[it.id]||[]; const checked=!!st.checked[it.id];
  const inputs=card.querySelectorAll("input"); const labels=card.querySelectorAll("label.choice");
  inputs.forEach((inp,i)=>{inp.checked=sel.includes(i); inp.disabled=checked; labels[i].classList.remove("ok","ng"); if(checked){ if(it.choices[i].ok) labels[i].classList.add("ok"); else if(sel.includes(i)) labels[i].classList.add("ng"); }});
  const btn=card.querySelector('[data-role=check]'); btn.disabled = checked || sel.length!==it.multi;
  card.querySelector('[data-role=redo]').hidden=!checked;
  const v=card.querySelector(".verdict"); const exp=card.querySelector(".exp");
  const n=document.getElementById("nav"+it.id); n.className="";
  if(checked){ const ok=isCorrect(it); v.textContent=(ok?"正解":"不正解")+"（正解："+it.choices.map((c,i)=>c.ok?L[i]:null).filter(Boolean).join("・")+"）"; v.className="verdict "+(ok?"ok":"ng");
    exp.innerHTML=""; const ul=el("ul"); it.choices.forEach((c,i)=>ul.append(el("li",{text:(c.ok?"✅ ":"❌ ")+L[i]+". "+c.why}))); exp.append(el("strong",{text:"解説"}),ul); exp.hidden=false; n.className=ok?"correct":"wrong";
  } else { v.textContent=""; v.className="verdict"; exp.hidden=true; if(sel.length) n.className="answered"; }
}
function scores(){
  const by={}; for(const d in DATA.domains) by[d]={n:0,ok:0,done:0};
  for(const it of DATA.items){ const b=by[it.d]; b.n++; if(st.checked[it.id]){b.done++; if(isCorrect(it)) b.ok++;} }
  return by;
}
function updateHeader(){
  const done=DATA.items.filter(it=>st.checked[it.id]).length; const ok=DATA.items.filter(it=>st.checked[it.id]&&isCorrect(it)).length;
  document.getElementById("progress").textContent=`答え合わせ ${done}/${DATA.items.length}・正解 ${ok}`;
}
function showResult(){
  const by=scores(); const r=document.getElementById("result"); r.innerHTML=""; r.hidden=false;
  r.append(el("h2",{text:"分野別スコア"}));
  const t=el("table"); t.append(el("tr",null,el("th",{text:"分野"}),el("th",{text:"正解/問題数"}),el("th",{text:"正答率"}),el("th",{text:"答え合わせ済み"})));
  let N=0,OK=0,D=0;
  for(const d in DATA.domains){ const b=by[d]; N+=b.n; OK+=b.ok; D+=b.done; t.append(el("tr",null,el("td",{text:DATA.domains[d]}),el("td",{text:`${b.ok}/${b.n}`}),el("td",{text:Math.round(100*b.ok/b.n)+"%"}),el("td",{text:`${b.done}/${b.n}`}))); }
  t.append(el("tr",null,el("th",{text:"合計"}),el("th",{text:`${OK}/${N}`}),el("th",{text:Math.round(100*OK/N)+"%"}),el("th",{text:`${D}/${N}`})));
  r.append(t);
  const pct=Math.round(100*OK/N);
  r.append(el("p",{text: pct>=80?"目標（80%以上）に到達しています。間違えた問題のタスクを復習しましょう。":"目標は80%以上です（本番のスケールスコア720は正答率と1対1対応しないため余裕を持たせた目安）。正答率の低い分野のタスクをガイドで復習しましょう。"}));
  const wrong=DATA.items.filter(it=>st.checked[it.id]&&!isCorrect(it)).map(it=>`Q${it.id}(タスク${it.task})`);
  if(wrong.length) r.append(el("p",{text:"復習する問題："+wrong.join("、")}));
  r.scrollIntoView({behavior:"smooth"});
}
function tick(){ const tEl=document.getElementById("timer"); if(!st.start){tEl.textContent="経過 00:00 / 目標 "+DATA.targetMin+"分";return;} const s=Math.floor((Date.now()-st.start)/1000); const m=String(Math.floor(s/60)).padStart(2,"0"), ss=String(s%60).padStart(2,"0"); tEl.textContent=`経過 ${m}:${ss} / 目標 ${DATA.targetMin}分`; }
document.getElementById("btnResult").addEventListener("click",showResult);
document.getElementById("btnReset").addEventListener("click",()=>{ if(!confirm("すべての解答と進捗を消去します。よろしいですか？")) return; st={sel:{},checked:{},start:null}; save(); document.getElementById("result").hidden=true; render(); tick(); });
render(); tick(); setInterval(tick,1000);
window.__ccarf={DATA,get st(){return st},isCorrect,scores};
</script>
