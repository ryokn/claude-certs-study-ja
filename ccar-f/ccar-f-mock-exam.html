<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F 模擬試験（日本語）</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f1f1f;--muted:#666;--accent:#c96442;--ok:#1d7a46;--okbg:#e6f4ec;--ng:#b3261e;--ngbg:#fbeaea;--line:#e2dfd8}
*{box-sizing:border-box}
body{margin:0;overflow-wrap:anywhere;word-break:break-word;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
header{position:sticky;top:0;z-index:10;background:#fffdf9;border-bottom:1px solid var(--line);padding:8px 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:860px;margin:0 auto}
.bar h1{font-size:16px;margin:0 8px 0 0}
.pill{background:#f0ece4;border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:860px;margin:0 auto;padding:12px}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px}
.nav a{display:inline-block;min-width:34px;text-align:center;padding:2px 4px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink);text-decoration:none}
.nav a.answered{background:#f3e7df}
.nav a.correct{background:var(--okbg);border-color:var(--ok)}
.nav a.wrong{background:var(--ngbg);border-color:var(--ng)}
.card{scroll-margin-top:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.tag{display:inline-block;background:#f0ece4;border-radius:6px;padding:0 6px;margin-right:4px}
.qtext{white-space:pre-wrap;margin:6px 0 10px}
.multi{color:var(--accent);font-weight:bold}
label.choice span{min-width:0}
label.choice{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
label.choice input{margin-top:6px;flex:none;width:18px;height:18px}
label.choice.ok{background:var(--okbg);border-color:var(--ok)}
label.choice.ng{background:var(--ngbg);border-color:var(--ng)}
.letter{font-weight:bold;flex:none}
.actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.verdict{font-weight:bold}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.exp{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.exp li{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{border:1px solid var(--line);padding:6px;text-align:left}
th{background:#f6f2ea}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:520px){body{font-size:15px}.bar h1{font-size:15px;width:100%}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>CCAR-F 模擬試験</h1>
  <span class="pill" id="progress">0/0</span>
  <span class="pill" id="timer">00:00</span>
  <button id="btnResult" class="primary">結果を見る</button>
  <button id="btnReset">リセット</button>
</div></header>
<main>
  <p class="hint" id="intro"></p>
  <div class="nav" id="nav"></div>
  <div id="qs"></div>
  <div class="card" id="result" hidden></div>
</main>
<script>
const DATA = {"items": [{"id": 1, "d": "D1", "task": "1.1", "scenario": "シナリオ1 カスタマーサポート解決エージェント", "q": "サポートエージェントのループを次のように実装しました。「Claudeの応答にテキストブロックが含まれていたら、それを顧客への最終回答とみなしてループを終了する」。本番では、Claudeが「注文を確認します」というテキストと tool_use ブロックを同じ応答で返したときに、ツールが実行されずに会話が終わってしまうケースが出ています。最も適切な修正はどれですか。", "multi": 1, "choices": [{"t": "応答テキストに「完了」「以上です」などの語が含まれるかを正規表現で判定して終了する。", "ok": false, "why": "自然言語のシグナルを解析して終了判定するのは、ガイドが明示するアンチパターンです。"}, {"t": "テキストブロックとtool_useブロックが同時に返らないよう、システムプロンプトで「ツールを呼ぶときは説明文を書かないこと」と指示する。", "ok": false, "why": "プロンプトで出力形を縛っても確率的で、根本原因（終了判定の誤り）を直していません。"}, {"t": "反復回数の上限を3回に固定し、上限に達したらその時点の応答を最終回答とする。", "ok": false, "why": "恣意的な反復上限を「主要な」停止メカニズムにするのはアンチパターンです（安全装置として併用するのは可）。"}, {"t": "stop_reason を確認し、\"tool_use\" ならツールを実行して tool_result を会話履歴に追加して次の反復へ進み、\"end_turn\" ならループを終了する。", "ok": true, "why": "エージェントループの正しい制御フローです（タスク1.1）。テキストの有無ではなく stop_reason で継続/終了を判断し、ツール結果を履歴に追加して次の推論に使わせます。"}], "answer": ["D"]}, {"id": 2, "d": "D1", "task": "1.2", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "リサーチシステムのコーディネーターは、どんな質問でも「ウェブ検索 → 文書分析 → 統合 → レポート生成」の全サブエージェントを順に呼び出しています。「この論文の出版年は？」のような単純な質問でも数分かかり、コストも高くなっています。最も適切な改善はどれですか。", "multi": 1, "choices": [{"t": "すべてのサブエージェントをより高速・低価格なモデルに切り替える。", "ok": false, "why": "不要なサブエージェントを呼んでいるという根本原因は残ります。"}, {"t": "コーディネーターがクエリの要件と複雑さを分析し、必要なサブエージェントだけを動的に選んで呼び出すように設計する。", "ok": true, "why": "タスク1.2のスキル「常にパイプライン全体を経由させるのではなく、呼び出すサブエージェントを動的に選択する」そのものです。"}, {"t": "コーディネーターを廃止し、各サブエージェントが必要に応じて互いを直接呼び出せるようにする。", "ok": false, "why": "ハブアンドスポーク（コーディネーター経由の通信）による可観測性・一貫したエラー処理・制御された情報フローを失います。"}, {"t": "パイプラインの各段の結果をキャッシュし、同じ質問が来たら再利用する。", "ok": false, "why": "初回の無駄な全段実行は解消されず、問題の本質（ルーティング設計）に対処していません。"}], "answer": ["B"]}, {"id": 3, "d": "D1", "task": "1.3", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "統合（synthesis）サブエージェントのレポートに、ウェブ検索サブエージェントが見つけた重要な統計や出典URLが含まれていません。ログを見ると、コーディネーターは統合サブエージェントを「これまでの調査結果を統合して、出典付きのレポートにしてください」というプロンプトだけで呼び出していました。最も可能性の高い原因と対策はどれですか。", "multi": 1, "choices": [{"t": "サブエージェントは親の会話履歴を継承するが、履歴が長すぎて重要情報が埋もれている。/compact で履歴を圧縮してから呼び出す。", "ok": false, "why": "前提が誤りです。サブエージェントは親の履歴を自動継承しません。"}, {"t": "統合サブエージェントのmax_tokensが小さすぎて出典が切り捨てられている。max_tokensを増やす。", "ok": false, "why": "そもそも入力に調査結果が渡っていないので、出力上限を増やしても解決しません。"}, {"t": "サブエージェントは親の会話履歴を自動的には継承しない。先行エージェントの調査結果全体を、内容とメタデータ（URL・文書名・ページ番号）を分けた構造化形式で統合サブエージェントのプロンプトに直接含める。", "ok": true, "why": "タスク1.3の核心です。サブエージェントのコンテキストは分離されており、渡したいものはプロンプト（Task/Agentツールのprompt）で明示的に渡します。"}, {"t": "統合サブエージェントにもウェブ検索ツールを与え、必要な統計を自分で再検索させる。", "ok": false, "why": "専門外ツールの付与は誤用の原因になり（タスク2.3）、重複作業とコスト増を招きます。"}], "answer": ["C"]}, {"id": 4, "d": "D1", "task": "1.3", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "Agent SDKで新しく構築したコーディネーターが、定義したサブエージェント（web-searcher、doc-analyzer）を一度も起動せず、自分だけで回答を作ってしまいます。設定上まず確認すべき点を【2つ】選んでください。", "multi": 2, "choices": [{"t": "サブエージェントがコーディネーターの会話履歴を共有する設定になっているか。", "ok": false, "why": "そのような自動共有はありません。コンテキストはプロンプトで明示的に渡します。"}, {"t": "各 AgentDefinition の description が、どんな場合にそのサブエージェントを使うべきかを明確に書いているか。", "ok": true, "why": "description はClaudeがどのサブエージェントに委任するかを判断する材料です（AgentDefinitionの必須項目）。"}, {"t": "コーディネーターの max_tokens が十分大きいか。", "ok": false, "why": "委任しない原因とは無関係です。"}, {"t": "コーディネーターにもウェブ検索ツールと文書解析ツールを直接与えているか。", "ok": false, "why": "与えるとむしろコーディネーターが自分で作業し、委任されにくくなります。"}, {"t": "コーディネーターの allowedTools に \"Task\"（サブエージェントを起動するツール）が含まれているか。", "ok": true, "why": "ガイドのタスク1.3：コーディネーターがサブエージェントを呼ぶには allowedTools に \"Task\" が必要です（現行ドキュメントでは同ツールは \"Agent\" と表示。旧名 \"Task\"）。"}], "answer": ["B", "E"]}, {"id": 5, "d": "D1", "task": "1.4", "scenario": "シナリオ1 カスタマーサポート解決エージェント", "q": "顧客が「注文A-1029の返金」「配送先住所の変更」「先月の二重請求」を1つのメッセージで問い合わせてきました。エージェントは途中で二重請求について人間の担当者にエスカレーションしますが、担当者は会話記録を参照できない別システムを使っており、毎回顧客に最初から事情を聞き直しています。最も効果的な改善はどれですか。", "multi": 1, "choices": [{"t": "エスカレーション前に「担当者に詳しく説明してください」と顧客に案内する。", "ok": false, "why": "顧客への負担転嫁であり、システムの改善になっていません。"}, {"t": "エスカレーション時に、顧客ID、各案件の状況、根本原因の分析、金額、実施済みの対応、推奨アクションを含む構造化されたハンドオフサマリーを作成して渡す。", "ok": true, "why": "タスク1.4のスキル「会話記録にアクセスできない人間の担当者向けに、構造化されたハンドオフサマリーを作成する」です。"}, {"t": "エージェントに「引き継ぎ時は簡潔な一文で要約する」よう指示する。", "ok": false, "why": "金額・ID・推奨アクションなど必要な事実が欠落しやすく、構造化もされません。"}, {"t": "複雑そうな問い合わせは、最初の発言の時点ですべて人間にエスカレーションする。", "ok": false, "why": "初回解決率を下げるうえ、引き継ぎ情報不足という問題は解消しません。"}], "answer": ["B"]}, {"id": 6, "d": "D1", "task": "1.5", "scenario": "シナリオ1 カスタマーサポート解決エージェント", "q": "社内ポリシーでは「$500を超える返金は人間の承認が必要」です。システムプロンプトに明記しているにもかかわらず、ログでは約2%のケースでエージェントが $800 の process_refund を直接呼び出しています。最も適切な対策はどれですか。", "multi": 1, "choices": [{"t": "システムプロンプトのポリシー部分を大文字・太字にし、冒頭と末尾の2か所に繰り返し記載する。", "ok": false, "why": "プロンプトベースの遵守は失敗率がゼロになりません（タスク1.4/1.5）。"}, {"t": "PostToolUseフックで$500超の返金を検出し、実行後に返金を取り消すAPIを呼ぶ。", "ok": false, "why": "実行後では遅く、副作用（実際の返金・通知）が起きてしまいます。阻止は実行前のインターセプトで行います。"}, {"t": "送信されるツール呼び出しをインターセプトするフック（PreToolUse）で、amountが$500を超える process_refund をブロックし、理由を返して escalate_to_human のワークフローへ誘導する。", "ok": true, "why": "タスク1.5：確実な遵守が必要なビジネスルールには、確率的なプロンプトではなく決定論的なフックを使います。"}, {"t": "$500超の返金を正しく拒否するfew-shotの例を10件追加する。", "ok": false, "why": "改善はしても確率的で、金銭的リスクのある要件の「保証」にはなりません。"}], "answer": ["C"]}, {"id": 7, "d": "D1", "task": "1.5", "scenario": "シナリオ4 Claudeによる開発者の生産性向上", "q": "開発者支援エージェントは3つのMCPサーバー（課題管理・CI・監視）を使います。日時はUnixタイムスタンプ、ISO 8601、\"11/03 14:00\"形式が混在し、ステータスは数値コード（0/1/2）と文字列が混在しているため、エージェントが時系列や状態を誤解することがあります。エージェント側で最も確実に対処する方法はどれですか。", "multi": 1, "choices": [{"t": "PreToolUseフックでツール呼び出しの引数を正規化する。", "ok": false, "why": "問題はツールの「結果」の形式です。PreToolUseは呼び出し前（入力側）に作用します。"}, {"t": "PostToolUseフックで各ツールの結果を受け取り、モデルが処理する前に日時をISO 8601へ、ステータスを統一した文字列へ正規化する。", "ok": true, "why": "タスク1.5のスキル「不均一なデータ形式を正規化するPostToolUseフック」です。結果をモデルが見る前に決定論的に変換します。"}, {"t": "システムプロンプトに各サーバーの日時形式とステータスコード表を記載し、解釈させる。", "ok": false, "why": "確率的で、表の参照漏れや計算ミスが残ります。"}, {"t": "各ツール結果を受け取るたびに、Claudeに「形式を統一して要約して」と追加で依頼する。", "ok": false, "why": "追加の推論コストがかかり、変換の正確性も保証されません。"}], "answer": ["B"]}, {"id": 8, "d": "D1", "task": "1.6", "scenario": "シナリオ4 Claudeによる開発者の生産性向上", "q": "「テストがほぼ存在しない10万行のレガシーコードベースに、包括的なテストを追加する」というタスクをエージェントに任せます。最も適切なタスク分解の方針はどれですか。", "multi": 1, "choices": [{"t": "全ファイルに対するテスト生成を一度に並列で起動し、最後に結果をまとめる。", "ok": false, "why": "構造理解なしの一斉生成は重複・低価値テスト・依存関係の破綻を招きます。"}, {"t": "まず構造（モジュール・依存関係・エントリポイント）を把握し、影響の大きい領域を特定して優先順位付きの計画を作り、依存関係が見つかるたびに計画を適応させる。", "ok": true, "why": "タスク1.6：オープンエンドな調査タスクには、発見に応じてサブタスクを生成する動的・適応的な分解が適します。"}, {"t": "「カバレッジ100%のテストを書いて」という1つの詳細なプロンプトで一度に実行する。", "ok": false, "why": "注意の分散を招き、適応的な計画もありません。"}, {"t": "ファイル名のアルファベット順に1ファイルずつテストを書く固定の逐次パイプラインを組む。", "ok": false, "why": "固定パイプライン（プロンプトチェーン）は予測可能な多面的レビュー向き。重要度も依存関係も考慮されません。"}], "answer": ["B"]}, {"id": 9, "d": "D1", "task": "1.7", "scenario": "シナリオ4 Claudeによる開発者の生産性向上", "q": "昨日、名前付きセッション「auth-refactor」で認証モジュールの30ファイルを分析しました。今朝、同僚がそのうち3ファイル（session.ts、token.ts、middleware.ts）を変更してマージしました。分析の大部分はまだ有効です。最も効率的で信頼性の高い進め方はどれですか。", "multi": 1, "choices": [{"t": "--resume auth-refactor でセッションを再開し、変更された3ファイルを具体的に伝えて、その部分だけ的を絞って再分析させる。", "ok": true, "why": "タスク1.7：以前のコンテキストがおおむね有効なら再開し、変更点を具体的に伝えて的を絞った再分析を行います。"}, {"t": "何も伝えずにセッションを再開し、そのまま実装を始める。", "ok": false, "why": "古いツール結果（変更前の3ファイル）に基づいて誤った判断をする恐れがあります。"}, {"t": "fork_session で2つのブランチを作り、片方で変更前、もう片方で変更後を分析させる。", "ok": false, "why": "fork_sessionは共通のベースラインから異なるアプローチを比較するためのもので、この目的には不要です。"}, {"t": "セッションを再開し、「コードが変わったかもしれないので全体を再調査して」と依頼する。", "ok": false, "why": "有効な分析まで捨てることになり非効率です。"}], "answer": ["A"]}, {"id": 10, "d": "D2", "task": "2.1", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "リサーチシステムには analyze_content（説明：「コンテンツを分析します」）と analyze_document（説明：「文書を分析します」）の2つのツールがあり、ウェブ検索結果がPDF解析用の analyze_document に送られる誤ルーティングが頻発しています。さらにシステムプロンプトには「文書を扱うときは必ず徹底的に分析すること」という一文があります。最も効果的な対応はどれですか。", "multi": 1, "choices": [{"t": "temperatureを0にしてツール選択を安定させる。", "ok": false, "why": "説明が曖昧なままでは、安定して誤ったツールを選ぶだけです。"}, {"t": "analyze_content を extract_web_results に改名してウェブ結果専用の説明（入力形式・例・使わない場面）を書き、システムプロンプトのキーワードに敏感な一文も見直す。", "ok": true, "why": "タスク2.1：説明がツール選択の主要な手がかり。機能重複を名前と説明で解消し、ツール選択を歪めるシステムプロンプトの文言もレビューします。"}, {"t": "2つのツールを1つの汎用 analyze ツールに統合し、内部で種類を判定させる。", "ok": false, "why": "ガイドの方向性は「汎用ツールを目的別に分割」です。統合は判断をツール内部に押し込むだけです。"}, {"t": "ユーザー入力をキーワードで分類し、ツールを事前に選ぶルーティング層を追加する。", "ok": false, "why": "過剰設計で、LLMの自然言語理解を迂回します（サンプル問題2と同じ論点）。"}], "answer": ["B"]}, {"id": 11, "d": "D2", "task": "2.2", "scenario": "シナリオ1 カスタマーサポート解決エージェント", "q": "process_refund MCPツールは、タイムアウト、無効な注文ID、返品期限切れ（ポリシー違反）、権限不足のいずれでも {\"error\": \"Operation failed\"} だけを返します。その結果、エージェントは返品期限切れのケースでもリトライを繰り返し、顧客に適切な説明もできていません。最も適切な改善はどれですか。", "multi": 1, "choices": [{"t": "エラー時は空の成功レスポンスを返し、エージェントには「該当なし」と伝えさせる。", "ok": false, "why": "失敗を成功として握りつぶすアンチパターンです（タスク5.3）。"}, {"t": "エラー時は例外を投げて会話を終了し、顧客に再度問い合わせてもらう。", "ok": false, "why": "単一の失敗でワークフロー全体を止めるアンチパターンです。"}, {"t": "エージェント側で、エラー時は常に指数バックオフで3回リトライするよう指示する。", "ok": false, "why": "ポリシー違反など再試行しても成功しないエラーで無駄なリトライが増えます。"}, {"t": "isError: true とともに、errorCategory（transient/validation/business/permission）、isRetryable、顧客向けにも使える人間が読める説明を含む構造化エラーを返す。", "ok": true, "why": "タスク2.2：一律のエラーではエージェントが適切な復旧判断をできません。リトライ可否と分類をメタデータで伝えます。"}], "answer": ["D"]}, {"id": 12, "d": "D2", "task": "2.3", "scenario": "シナリオ3 マルチエージェントリサーチシステム", "q": "開発初期の名残で、リサーチシステムの全サブエージェントが同じ18個のツールにアクセスできます。統合サブエージェントが勝手にウェブ検索を始める、文書分析サブエージェントがレポート生成ツールを呼ぶ、といった誤用が目立ちます。最も適切な対応はどれですか。", "multi": 1, "choices": [{"t": "より大きなコンテキストウィンドウを持つモデルに切り替える。", "ok": false, "why": "コンテキスト量ではなく、選択肢が多すぎる設計が原因です。"}, {"t": "各サブエージェントのツールを役割に必要な4〜5個に絞り、頻度の高い役割横断ニーズ（例：統合エージェントの簡単な事実確認）にはスコープを限定したツール（verify_factなど）だけを与える。", "ok": true, "why": "タスク2.3：ツールが多すぎると選択の信頼性が落ち、専門外ツールは誤用されます。最小権限＋限定的な役割横断ツールが原則です。"}, {"t": "システムプロンプトに18個すべてのツールの使い分け表を追加する。", "ok": false, "why": "判断の複雑さ自体は減りません。"}, {"t": "すべてのサブエージェントで tool_choice: \"any\" を設定する。", "ok": false, "why": "\"any\"は「何らかのツールを必ず呼ぶ」設定で、誤ったツール選択はむしろ増え得ます。"}], "answer": ["B"]}, {"id": 13, "d": "D2", "task": "2.3", "scenario": "シナリオ6 構造化データ抽出", "q": "抽出パイプラインでは、最初に必ず extract_metadata（文書種別・日付・発行者）を実行し、その結果を使って後続の enrich_vendor や lookup_contract などのエンリッチメントツールを呼びます。現在 tool_choice: \"auto\" のため、ときどき extract_metadata より先にエンリッチメントツールが呼ばれたり、ツールを使わずテキストで答えたりします。最も適切な設定はどれですか。", "multi": 1, "choices": [{"t": "auto のまま、システムプロンプトに「必ず最初に extract_metadata を呼ぶこと」と書く。", "ok": false, "why": "確率的で、現在の問題（順序違反）を確実には防げません。"}, {"t": "tool_choice: \"none\" にして、メタデータはテキストで出力させる。", "ok": false, "why": "ツールを使わせない設定で、構造化出力の保証も失います。"}, {"t": "最初のリクエストで tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"} を指定して強制し、後続のステップはフォローアップのターンで処理する。", "ok": true, "why": "タスク2.3/4.3：特定のツールを最初に確実に呼ばせるには強制的なツール選択を使い、その後のステップは次のターンで行います。"}, {"t": "tool_choice: \"any\" を設定する。", "ok": false, "why": "\"any\"は何らかのツール呼び出しを保証しますが、どのツールかは選べないため順序は保証されません。"}], "answer": ["C"]}, {"id": 14, "d": "D2", "task": "2.4", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "チーム全員でGitHub用MCPサーバーを共有したい一方、トークンはリポジトリにコミットしたくありません。また、あなた個人は実験中の別のMCPサーバーを自分の環境でだけ使いたいと考えています。適切な設定を【2つ】選んでください。", "multi": 2, "choices": [{"t": "実験用サーバーはユーザースコープ（~/.claude.json、例：claude mcp add --scope user）に設定する。", "ok": true, "why": "個人用・実験的なサーバーはユーザーレベル（~/.claude.json）。なお既定のlocalスコープも ~/.claude.json に保存され当該プロジェクトのみに効きます。"}, {"t": "実験用サーバーも .mcp.json に入れ、\"personal\": true フラグを付けて他のメンバーには読み込ませない。", "ok": false, "why": "そのようなフラグは存在しません。"}, {"t": "プロジェクトルートの .mcp.json にGitHubサーバーを定義し、トークンは \"${GITHUB_TOKEN}\" のような環境変数展開で参照してコミットする。", "ok": true, "why": "タスク2.4：プロジェクトスコープ（.mcp.json）は共有用。環境変数展開でシークレットをコミットせずに済みます。"}, {"t": ".mcp.json にトークンを直接書き、.mcp.json 自体を .gitignore に追加する。", "ok": false, "why": "それではチームに共有されません。"}, {"t": "MCPサーバーの接続情報をプロジェクトの CLAUDE.md に記載する。", "ok": false, "why": "CLAUDE.mdは指示・コンテキスト用で、MCPサーバーの設定の仕組みではありません。"}], "answer": ["A", "C"]}, {"id": 15, "d": "D2", "task": "2.5", "scenario": "シナリオ4 Claudeによる開発者の生産性向上", "q": "不慣れなレガシーコードベースで、エラーメッセージ \"PAYMENT_DECLINED\" がどこで発生し、どのような流れで呼ばれているかを調べたいと考えています。組み込みツールの使い方として最も適切なのはどれですか。", "multi": 1, "choices": [{"t": "Editで \"PAYMENT_DECLINED\" を一時的に別の文字列に置き換え、テストの失敗箇所から発生源を推測する。", "ok": false, "why": "調査目的でコードを変更するのは不適切で、Editの用途（一意テキストに対する的を絞った変更）とも違います。"}, {"t": "Grepで \"PAYMENT_DECLINED\" を含むファイルと行を特定し、そこからReadでimportや呼び出し元をたどってフローを段階的に追跡する。", "ok": true, "why": "タスク2.5：内容検索はGrep、そこから必要なファイルだけReadで追う、段階的な理解の構築です。"}, {"t": "まずReadで全ファイルを読み込んでから、該当箇所を探す。", "ok": false, "why": "コンテキストを浪費します。ガイドは「最初にすべてを読むのではなくGrepから」と明示しています。"}, {"t": "Globで **/*PAYMENT* に一致するファイルを探す。", "ok": false, "why": "Globはファイル名/パスのパターン一致です。ファイル内容の文字列検索には使えません。"}], "answer": ["B"]}, {"id": 16, "d": "D3", "task": "3.1", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "シニアエンジニアの環境では、Claude Codeがチームの命名規約とテスト規約に従ってコードを生成します。しかし新しく参加したメンバーの環境では規約が反映されません。調べると、規約はシニアエンジニアの ~/.claude/CLAUDE.md に書かれていました。最も適切な対応はどれですか。", "multi": 1, "choices": [{"t": "新メンバーに、シニアの ~/.claude/CLAUDE.md を自分のホームにコピーしてもらう。", "ok": false, "why": "一時的には動いても、更新が共有されず保守できません。"}, {"t": "規約を .claude/settings.json の rules キーに記述する。", "ok": false, "why": "settings.jsonは権限・フック・環境変数などの設定用で、規約文書を置く場所ではありません。"}, {"t": "規約を CLAUDE.local.md に移す。", "ok": false, "why": "CLAUDE.local.mdは個人用（.gitignore推奨）のプロジェクト設定で、共有されません。"}, {"t": "規約をプロジェクトレベルの CLAUDE.md（ルートの CLAUDE.md または .claude/CLAUDE.md）に移してコミットし、各自 /memory で読み込まれているメモリファイルを確認する。", "ok": true, "why": "タスク3.1：ユーザーレベルの指示はバージョン管理で共有されません。チーム共有はプロジェクトレベルに置きます。"}], "answer": ["D"]}, {"id": 17, "d": "D3", "task": "3.2", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "チームの /analyze-deps スキルは、コードベース全体の依存関係を調べて大量の中間出力を生成します。実行するたびにメインの会話コンテキストが中間出力で埋まり、その後の作業の質が落ちます。最も適切な対応はどれですか。", "multi": 1, "choices": [{"t": "SKILL.md のフロントマターに context: fork を設定し、分離されたサブエージェントのコンテキストで実行して要約だけを受け取る。", "ok": true, "why": "タスク3.2：冗長な出力を出すスキルは context: fork でメインセッションから分離します。"}, {"t": "フロントマターに argument-hint を追加する。", "ok": false, "why": "argument-hintは引数入力を促すヒントで、コンテキスト分離とは無関係です。"}, {"t": "スキル実行後に毎回 /clear を実行する。", "ok": false, "why": "それまでの作業コンテキストまで失います。"}, {"t": "スキルの内容を CLAUDE.md に移し、常に読み込まれるようにする。", "ok": false, "why": "常時読み込みでコンテキストをさらに消費し、出力の汚染も解消しません。"}], "answer": ["A"]}, {"id": 18, "d": "D3", "task": "3.3", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "Terraformファイル（*.tf）は infra/、services/*/deploy/、modules/ などコードベース全体に散在しています。Terraform専用の規約は .tf ファイルを編集するときだけ読み込ませ、それ以外の作業ではトークンを消費させたくありません。最も保守しやすい方法はどれですか。", "multi": 1, "choices": [{"t": "Terraform規約をスキルにして、開発者が毎回 /terraform-rules を実行する。", "ok": false, "why": "手動呼び出しに依存し、「自動的・条件付き」の要件を満たしません。"}, {"t": "Terraformファイルがある各ディレクトリにCLAUDE.mdを置き、同じ規約をコピーする。", "ok": false, "why": "ディレクトリに紐づくため散在ファイルに不向きで、重複管理になります。"}, {"t": "ルートのCLAUDE.mdに「Terraform規約」という見出しで記載する。", "ok": false, "why": "常に読み込まれ、無関係な作業でもトークンを消費します。"}, {"t": ".claude/rules/terraform.md を作成し、YAMLフロントマターに paths: [\"**/*.tf\"] を指定する。", "ok": true, "why": "タスク3.3：パス固有ルールは一致するファイルを扱うときだけ読み込まれ、複数ディレクトリにまたがる規約に最適です。"}], "answer": ["D"]}, {"id": 19, "d": "D3", "task": "3.4", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "次のタスクのうち、プランモードを使わず直接実行（direct execution）で進めるのが最も適切なのはどれですか。", "multi": 1, "choices": [{"t": "モノリスの注文処理部分をマイクロサービスとして切り出す。", "ok": false, "why": "アーキテクチャ上の判断を伴うためプランモード向きです（サンプル問題5）。"}, {"t": "ロギングライブラリを別のものに移行する（影響は約60ファイル）。", "ok": false, "why": "多ファイル・大規模変更はプランモード向き（ガイドの例：45+ファイルのライブラリ移行）。"}, {"t": "外部決済サービスとの連携を、Webhook方式とポーリング方式のどちらで実装するか決めて実装する。", "ok": false, "why": "インフラ要件の異なる複数の有効なアプローチからの選択はプランモード向きです。"}, {"t": "明確なスタックトレースがある、1つの関数内のnull参照バグを修正する。", "ok": true, "why": "タスク3.4：範囲が明確でよく理解された変更（単一ファイルのバグ修正など）は直接実行が適切です。"}], "answer": ["D"]}, {"id": 20, "d": "D3", "task": "3.5", "scenario": "シナリオ2 Claude Codeによるコード生成", "q": "ログの日付文字列を正規化する関数をClaude Codeに書かせています。「さまざまな形式の日付をISO 8601に変換し、タイムゾーンがなければUTCとみなす」と文章で説明しましたが、\"03/11/2026\" や \"2026年11月3日 午後2時\" の解釈が毎回ぶれます。最も効果的な次の一手はどれですか。", "multi": 1, "choices": [{"t": "説明文をさらに長く詳細にし、重要な部分を太字で強調する。", "ok": false, "why": "すでに文章による説明が一貫しない状況で、同じ手段を強化しても効果は限定的です。"}, {"t": "「慎重に、正確に変換すること」と指示を追加する。", "ok": false, "why": "曖昧な一般的指示は精度を改善しません（タスク4.1と同じ考え方）。"}, {"t": "プランモードに切り替えて計画を立てさせる。", "ok": false, "why": "単一関数の変換仕様の問題で、プランモードの出番ではありません。"}, {"t": "具体的な入力と期待される出力の例を2〜3組（曖昧な形式を含めて）提示する。", "ok": true, "why": "タスク3.5：文章の説明が一貫して解釈されない場合、具体的な入出力例が最も効果的です（さらにテストケース化すればテスト駆動の反復にもつながります）。"}], "answer": ["D"]}, {"id": 21, "d": "D3", "task": "3.6", "scenario": "シナリオ5 継続的インテグレーションのためのClaude Code", "q": "CIでPRごとに claude -p によるレビューを実行し、指摘をインラインコメントとして投稿しています。開発者が修正コミットを追加するたびにレビューが再実行され、すでに指摘済み・対応済みの問題についても重複したコメントが付くため、不満が出ています。最も適切な改善はどれですか。", "multi": 1, "choices": [{"t": "「確信度の高い指摘だけを報告せよ」とプロンプトに追加する。", "ok": false, "why": "重複の原因（以前の指摘を知らない）に対処していません。"}, {"t": "再実行のたびに既存のボットコメントをすべて削除し、新しいレビュー結果を投稿し直す。", "ok": false, "why": "議論の履歴が失われ、未対応の問題が何かも分かりにくくなります。"}, {"t": "レビューは最初のコミットに対してだけ実行する。", "ok": false, "why": "新しいコミットで混入した問題を見逃します。"}, {"t": "再実行時に以前のレビューの指摘事項をコンテキストに含め、新規の問題またはまだ未対応の問題だけを報告するよう指示する。", "ok": true, "why": "タスク3.6のスキルそのものです。--output-format json と --json-schema で構造化しておくと、既存指摘との突き合わせも容易です。"}], "answer": ["D"]}, {"id": 22, "d": "D4", "task": "4.1", "scenario": "シナリオ5 継続的インテグレーションのためのClaude Code", "q": "自動コードレビューの誤検知が多く、開発者がボットの指摘をほぼ無視するようになりました。特に「命名スタイル」と「コメントの正確性」のカテゴリで誤検知が多発しています。プロンプトには既に「確信度の高い指摘のみを報告すること」と書いてあります。最も効果的な対応はどれですか。", "multi": 1, "choices": [{"t": "報告すべき問題（バグ、セキュリティ等）とスキップすべき問題（軽微なスタイル、局所的な慣習）を具体的なカテゴリ基準で定義し、誤検知の多いカテゴリは改善するまで一時的に無効化する。", "ok": true, "why": "タスク4.1：一般的な「確信度」指示より具体的なカテゴリ基準。誤検知の多いカテゴリの一時停止で開発者の信頼を回復します。"}, {"t": "同じPRを3回レビューし、3回すべてで出た指摘だけを投稿する。", "ok": false, "why": "断続的にしか検出されない本物のバグまで抑制してしまいます（サンプル問題12の論点）。"}, {"t": "「さらに保守的に判断し、少しでも迷ったら報告しない」と指示を強める。", "ok": false, "why": "「保守的に」といった一般的指示は精度向上につながらないとガイドが明言しています。"}, {"t": "各指摘に確信度（0〜1）を自己申告させ、0.9未満を自動的に破棄する。", "ok": false, "why": "自己申告の確信度はキャリブレーションされておらず、フィルタとして信頼できません。"}], "answer": ["A"]}, {"id": 23, "d": "D4", "task": "4.2", "scenario": "シナリオ6 構造化データ抽出", "q": "研究論文から「引用文献リスト」を抽出するシステムで、本文中にインライン引用がある論文や、方法論の詳細が本文に埋め込まれている論文では、必須フィールドが空（null）で返ることが多くなっています。指示文は既に詳細に書かれています。最も効果的な改善はどれですか。", "multi": 1, "choices": [{"t": "空で返った場合は同じプロンプトで最大5回リトライする。", "ok": false, "why": "原因（構造の多様性への対応不足）を変えないリトライでは改善しにくいです。"}, {"t": "指示文をさらに長くし、考えられるすべての文書構造を文章で列挙する。", "ok": false, "why": "すでに詳細な指示が不十分な状況で、例示の方が汎化に効きます。"}, {"t": "インライン引用と参考文献リスト、独立した方法論セクションと本文埋め込み、といった多様な文書構造から正しく抽出する例を示すfew-shotの例を追加する。", "ok": true, "why": "タスク4.2：詳細な指示だけで一貫しない場合、多様な構造の扱い方を示すfew-shotが最も効果的で、空/null抽出の改善にも有効です。"}, {"t": "該当フィールドをスキーマで必須（required）にし、空を許さない。", "ok": false, "why": "情報の見つけ方が分からないまま必須化すると、値の捏造（ハルシネーション）を誘発します。"}], "answer": ["C"]}, {"id": 24, "d": "D4", "task": "4.3", "scenario": "シナリオ6 構造化データ抽出", "q": "請求書抽出ツールのJSONスキーマを設計しています。発注番号（PO番号）が記載されていない請求書が約3割あり、費目カテゴリは「ソフトウェア」「ハードウェア」「保守」以外にもときどき新しいものが現れます。スキーマ設計として適切なものを【2つ】選んでください。", "multi": 2, "choices": [{"t": "カテゴリはenumをやめ、完全な自由記述文字列にする。", "ok": false, "why": "集計・下流連携が困難になり、表記ゆれが増えます。"}, {"t": "po_number を必須にし、記載がない場合は文脈から最も可能性の高い番号を推測させる。", "ok": false, "why": "値の捏造を設計で促してしまいます。"}, {"t": "category を enum [\"software\", \"hardware\", \"maintenance\", \"other\"] とし、\"other\" のときに内容を記述する category_detail 文字列フィールドを設ける。", "ok": true, "why": "拡張可能なカテゴリには \"other\"＋詳細文字列のパターン（曖昧なら \"unclear\" も検討）。"}, {"t": "po_number を任意（nullを許容）にし、文書に記載がない場合はnullを返すよう指示する。", "ok": true, "why": "タスク4.3：情報が存在しない可能性のあるフィールドを必須にすると、モデルが値を捏造しがちです。"}, {"t": "strict モードのツール使用にすれば、明細の合計と請求総額の一致も保証されるので、検証は不要になる。", "ok": false, "why": "厳密なスキーマは構文エラーを排除しますが、合計不一致などの意味的エラーは防げません。"}], "answer": ["C", "D"]}, {"id": 25, "d": "D4", "task": "4.4", "scenario": "シナリオ6 構造化データ抽出", "q": "契約書抽出の結果をPydanticで検証したところ、2種類の失敗がありました。(a) 契約日が \"2026/11/03\" 形式で、スキーマが要求するISO 8601（2026-11-03）と一致しない。(b) 契約番号が本文になく、今回入力していない別添付書類にだけ記載されている。最も適切な対応はどれですか。", "multi": 1, "choices": [{"t": "(a) は元の文書・失敗した抽出結果・具体的な検証エラーを含めてリトライし自己修正させる。(b) はリトライしても解決しないため、nullのまま人間のレビューに回すか添付書類を入手する。", "ok": true, "why": "タスク4.4：形式の不一致はエラーフィードバック付きリトライで直るが、ソースに情報がない場合はリトライが無効です。"}, {"t": "(a)(b) とも、同じプロンプトでそのまま再実行する。", "ok": false, "why": "具体的な検証エラーを渡さない再実行は、修正の手がかりになりません。"}, {"t": "(a) は人間が手で直し、(b) は契約番号を推測させるプロンプトでリトライする。", "ok": false, "why": "逆です。(a) は自動修正可能、(b) は推測させるべきではありません。"}, {"t": "(a)(b) とも、検証エラーメッセージを付けて最大3回リトライする。", "ok": false, "why": "(b) は情報自体が入力にないため、何度リトライしても正しい値は得られません（捏造リスク）。"}], "answer": ["A"]}, {"id": 26, "d": "D4", "task": "4.5", "scenario": "シナリオ6 構造化データ抽出",     it.choices.forEach((c,i)=>{
      const inp=el("input",{type:it.multi>1?"checkbox":"radio",name:"q"+it.id,value:String(i)});
      const lab=el("label",{class:"choice"},inp,el("span",{class:"letter",text:L[i]+"."}),el("span",{text:c.t}));
      inp.addEventListener("change",()=>{ if(st.checked[it.id]) return; let s=st.sel[it.id]||[]; if(it.multi>1){ s=inp.checked?[...new Set([...s,i])]:s.filter(x=>x!==i); } else { s=[i]; } st.sel[it.id]=s; if(!st.start) st.start=Date.now(); save(); update(it); });
      box.append(lab);
    });
    card.append(box);
    const btn=el("button",{class:"primary",text:"答え合わせ"}); btn.dataset.role="check";
    btn.addEventListener("click",()=>{ st.checked[it.id]=true; save(); update(it); updateHeader(); });
    const redo=el("button",{text:"やり直す"}); redo.dataset.role="redo";
    redo.addEventListener("click",()=>{ delete st.checked[it.id]; delete st.sel[it.id]; save(); update(it); updateHeader(); });
    card.append(el("div",{class:"actions"},btn,redo,el("span",{class:"verdict"})));
    card.append(el("div",{class:"exp",hidden:""}));
    qs.append(card);
    update(it);
  }
  updateHeader();
}
function update(it){
  const card=document.getElementById("q"+it.id);
  const sel=st.sel[it.id]||[]; const checked=!!st.checked[it.id];
  const inputs=card.querySelectorAll("input"); const labels=card.querySelectorAll("label.choice");
  inputs.forEach((inp,i)=>{inp.checked=sel.includes(i); inp.disabled=checked; labels[i].classList.remove("ok","ng"); if(checked){ if(it.choices[i].ok) labels[i].classList.add("ok"); else if(sel.includes(i)) labels[i].classList.add("ng"); }});
  const btn=card.querySelector('[data-role=check]'); btn.disabled = checked || sel.length!==it.multi;
  card.querySelector('[data-role=redo]').hidden=!checked;
  const v=card.querySelector(".verdict"); const exp=card.querySelector(".exp");
  const n=document.getElementById("nav"+it.id); n.className="";
  if(checked){ const ok=isCorrect(it); v.textContent=(ok?"正解":"不正解")+"（正解："+it.choices.map((c,i)=>c.ok?L[i]:null).filter(Boolean).join("・")+"）"; v.className="verdict "+(ok?"ok":"ng");
    exp.innerHTML=""; const ul=el("ul"); it.choices.forEach((c,i)=>ul.append(el("li",{text:(c.ok?"✅ ":"❌ ")+L[i]+". "+c.why}))); exp.append(el("strong",{text:"解説"}),ul); exp.hidden=false; n.className=ok?"correct":"wrong";
  } else { v.textContent=""; v.className="verdict"; exp.hidden=true; if(sel.length) n.className="answered"; }
}
function scores(){
  const by={}; for(const d in DATA.domains) by[d]={n:0,ok:0,done:0};
  for(const it of DATA.items){ const b=by[it.d]; b.n++; if(st.checked[it.id]){b.done++; if(isCorrect(it)) b.ok++;} }
  return by;
}
function updateHeader(){
  const done=DATA.items.filter(it=>st.checked[it.id]).length; const ok=DATA.items.filter(it=>st.checked[it.id]&&isCorrect(it)).length;
  document.getElementById("progress").textContent=`答え合わせ ${done}/${DATA.items.length}・正解 ${ok}`;
}
function showResult(){
  const by=scores(); const r=document.getElementById("result"); r.innerHTML=""; r.hidden=false;
  r.append(el("h2",{text:"分野別スコア"}));
  const t=el("table"); t.append(el("tr",null,el("th",{text:"分野"}),el("th",{text:"正解/問題数"}),el("th",{text:"正答率"}),el("th",{text:"答え合わせ済み"})));
  let N=0,OK=0,D=0;
  for(const d in DATA.domains){ const b=by[d]; N+=b.n; OK+=b.ok; D+=b.done; t.append(el("tr",null,el("td",{text:DATA.domains[d]}),el("td",{text:`${b.ok}/${b.n}`}),el("td",{text:Math.round(100*b.ok/b.n)+"%"}),el("td",{text:`${b.done}/${b.n}`}))); }
  t.append(el("tr",null,el("th",{text:"合計"}),el("th",{text:`${OK}/${N}`}),el("th",{text:Math.round(100*OK/N)+"%"}),el("th",{text:`${D}/${N}`})));
  r.append(t);
  const pct=Math.round(100*OK/N);
  r.append(el("p",{text: pct>=80?"目標（80%以上）に到達しています。間違えた問題のタスクを復習しましょう。":"目標は80%以上です（本番のスケールスコア720は正答率と1対1対応しないため余裕を持たせた目安）。正答率の低い分野のタスクをガイドで復習しましょう。"}));
  const wrong=DATA.items.filter(it=>st.checked[it.id]&&!isCorrect(it)).map(it=>`Q${it.id}(タスク${it.task})`);
  if(wrong.length) r.append(el("p",{text:"復習する問題："+wrong.join("、")}));
  r.scrollIntoView({behavior:"smooth"});
}
function tick(){ const tEl=document.getElementById("timer"); if(!st.start){tEl.textContent="経過 00:00 / 目標 "+DATA.targetMin+"分";return;} const s=Math.floor((Date.now()-st.start)/1000); const m=String(Math.floor(s/60)).padStart(2,"0"), ss=String(s%60).padStart(2,"0"); tEl.textContent=`経過 ${m}:${ss} / 目標 ${DATA.targetMin}分`; }
document.getElementById("btnResult").addEventListener("click",showResult);
document.getElementById("btnReset").addEventListener("click",()=>{ if(!confirm("すべての解答と進捗を消去します。よろしいですか？")) return; st={sel:{},checked:{},start:null}; save(); document.getElementById("result").hidden=true; render(); tick(); });
render(); tick(); setInterval(tick,1000);
window.__ccarf={DATA,get st(){return st},isCorrect,scores};
</script>
