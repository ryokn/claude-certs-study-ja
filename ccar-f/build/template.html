<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F 模擬試験（日本語）</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1f1f1f;--muted:#666;--accent:#c96442;--ok:#1d7a46;--okbg:#e6f4ec;--ng:#b3261e;--ngbg:#fbeaea;--line:#e2dfd8}
*{box-sizing:border-box}
body{margin:0;overflow-wrap:anywhere;word-break:break-word;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
header{position:sticky;top:0;z-index:10;background:#fffdf9;border-bottom:1px solid var(--line);padding:8px 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:860px;margin:0 auto}
.bar h1{font-size:16px;margin:0 8px 0 0}
.pill{background:#f0ece4;border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:860px;margin:0 auto;padding:12px}
.nav{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 12px}
.nav a{display:inline-block;min-width:34px;text-align:center;padding:2px 4px;border-radius:6px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink);text-decoration:none}
.nav a.answered{background:#f3e7df}
.nav a.correct{background:var(--okbg);border-color:var(--ok)}
.nav a.wrong{background:var(--ngbg);border-color:var(--ng)}
.card{scroll-margin-top:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.tag{display:inline-block;background:#f0ece4;border-radius:6px;padding:0 6px;margin-right:4px}
.qtext{white-space:pre-wrap;margin:6px 0 10px}
.multi{color:var(--accent);font-weight:bold}
label.choice span{min-width:0}
label.choice{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer}
label.choice input{margin-top:6px;flex:none;width:18px;height:18px}
label.choice.ok{background:var(--okbg);border-color:var(--ok)}
label.choice.ng{background:var(--ngbg);border-color:var(--ng)}
.letter{font-weight:bold;flex:none}
.actions{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.verdict{font-weight:bold}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.exp{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px}
.exp li{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{border:1px solid var(--line);padding:6px;text-align:left}
th{background:#f6f2ea}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:520px){body{font-size:15px}.bar h1{font-size:15px;width:100%}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>CCAR-F 模擬試験</h1>
  <span class="pill" id="progress">0/0</span>
  <span class="pill" id="timer">00:00</span>
  <button id="btnResult" class="primary">結果を見る</button>
  <button id="btnReset">リセット</button>
</div></header>
<main>
  <p class="hint" id="intro"></p>
  <div class="nav" id="nav"></div>
  <div id="qs"></div>
  <div class="card" id="result" hidden></div>
</main>
<script>
const DATA = /*__DATA__*/null;
const KEY = "ccarf-mock-v1";
const L = "ABCDE";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
let st = load() || {sel:{}, checked:{}, start:null};
function save(){try{localStorage.setItem(KEY, JSON.stringify(st))}catch(e){}}
function el(tag, attrs, ...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}for(const c of kids){if(c!=null)e.append(c)}return e}
function isCorrect(it){const s=(st.sel[it.id]||[]).slice().sort().join(",");const a=it.choices.map((c,i)=>c.ok?i:-1).filter(i=>i>=0).join(",");return s===a}
function render(){
  document.getElementById("intro").textContent = `全${DATA.items.length}問・目標${DATA.targetMin}分（1問2分）。選択して「答え合わせ」で解説を表示。【2つ選択】の問題は2つ選ぶと答え合わせできます。進捗はこのブラウザに自動保存されます。`;
  const qs=document.getElementById("qs"); qs.innerHTML="";
  const nav=document.getElementById("nav"); nav.innerHTML="";
  for(const it of DATA.items){
    nav.append(el("a",{href:"#q"+it.id,id:"nav"+it.id,text:"Q"+it.id}));
    const card=el("div",{class:"card",id:"q"+it.id});
    card.append(el("div",{class:"meta"},el("span",{class:"tag",text:"Q"+it.id}),el("span",{class:"tag",text:DATA.dshort[it.d]}),el("span",{class:"tag",text:"タスク"+it.task}),el("span",{text:it.scenario})));
    if(it.multi>1) card.append(el("div",{class:"multi",text:`【${it.multi}つ選択】`}));
    card.append(el("div",{class:"qtext",text:it.q}));
    const box=el("div");
    it.choices.forEach((c,i)=>{
      const inp=el("input",{type:it.multi>1?"checkbox":"radio",name:"q"+it.id,value:String(i)});
      const lab=el("label",{class:"choice"},inp,el("span",{class:"letter",text:L[i]+"."}),el("span",{text:c.t}));
      inp.addEventListener("change",()=>{ if(st.checked[it.id]) return; let s=st.sel[it.id]||[]; if(it.multi>1){ s=inp.checked?[...new Set([...s,i])]:s.filter(x=>x!==i); } else { s=[i]; } st.sel[it.id]=s; if(!st.start) st.start=Date.now(); save(); update(it); });
      box.append(lab);
    });
    card.append(box);
    const btn=el("button",{class:"primary",text:"答え合わせ"}); btn.dataset.role="check";
    btn.addEventListener("click",()=>{ st.checked[it.id]=true; save(); update(it); updateHeader(); });
    const redo=el("button",{text:"やり直す"}); redo.dataset.role="redo";
    redo.addEventListener("click",()=>{ delete st.checked[it.id]; delete st.sel[it.id]; save(); update(it); updateHeader(); });
    card.append(el("div",{class:"actions"},btn,redo,el("span",{class:"verdict"})));
    card.append(el("div",{class:"exp",hidden:""}));
    qs.append(card);
    update(it);
  }
  updateHeader();
}
function update(it){
  const card=document.getElementById("q"+it.id);
  const sel=st.sel[it.id]||[]; const checked=!!st.checked[it.id];
  const inputs=card.querySelectorAll("input"); const labels=card.querySelectorAll("label.choice");
  inputs.forEach((inp,i)=>{inp.checked=sel.includes(i); inp.disabled=checked; labels[i].classList.remove("ok","ng"); if(checked){ if(it.choices[i].ok) labels[i].classList.add("ok"); else if(sel.includes(i)) labels[i].classList.add("ng"); }});
  const btn=card.querySelector('[data-role=check]'); btn.disabled = checked || sel.length!==it.multi;
  card.querySelector('[data-role=redo]').hidden=!checked;
  const v=card.querySelector(".verdict"); const exp=card.querySelector(".exp");
  const n=document.getElementById("nav"+it.id); n.className="";
  if(checked){ const ok=isCorrect(it); v.textContent=(ok?"正解":"不正解")+"（正解："+it.choices.map((c,i)=>c.ok?L[i]:null).filter(Boolean).join("・")+"）"; v.className="verdict "+(ok?"ok":"ng");
    exp.innerHTML=""; const ul=el("ul"); it.choices.forEach((c,i)=>ul.append(el("li",{text:(c.ok?"✅ ":"❌ ")+L[i]+". "+c.why}))); exp.append(el("strong",{text:"解説"}),ul); exp.hidden=false; n.className=ok?"correct":"wrong";
  } else { v.textContent=""; v.className="verdict"; exp.hidden=true; if(sel.length) n.className="answered"; }
}
function scores(){
  const by={}; for(const d in DATA.domains) by[d]={n:0,ok:0,done:0};
  for(const it of DATA.items){ const b=by[it.d]; b.n++; if(st.checked[it.id]){b.done++; if(isCorrect(it)) b.ok++;} }
  return by;
}
function updateHeader(){
  const done=DATA.items.filter(it=>st.checked[it.id]).length; const ok=DATA.items.filter(it=>st.checked[it.id]&&isCorrect(it)).length;
  document.getElementById("progress").textContent=`答え合わせ ${done}/${DATA.items.length}・正解 ${ok}`;
}
function showResult(){
  const by=scores(); const r=document.getElementById("result"); r.innerHTML=""; r.hidden=false;
  r.append(el("h2",{text:"分野別スコア"}));
  const t=el("table"); t.append(el("tr",null,el("th",{text:"分野"}),el("th",{text:"正解/問題数"}),el("th",{text:"正答率"}),el("th",{text:"答え合わせ済み"})));
  let N=0,OK=0,D=0;
  for(const d in DATA.domains){ const b=by[d]; N+=b.n; OK+=b.ok; D+=b.done; t.append(el("tr",null,el("td",{text:DATA.domains[d]}),el("td",{text:`${b.ok}/${b.n}`}),el("td",{text:Math.round(100*b.ok/b.n)+"%"}),el("td",{text:`${b.done}/${b.n}`}))); }
  t.append(el("tr",null,el("th",{text:"合計"}),el("th",{text:`${OK}/${N}`}),el("th",{text:Math.round(100*OK/N)+"%"}),el("th",{text:`${D}/${N}`})));
  r.append(t);
  const pct=Math.round(100*OK/N);
  r.append(el("p",{text: pct>=80?"目標（80%以上）に到達しています。間違えた問題のタスクを復習しましょう。":"目標は80%以上です（本番のスケールスコア720は正答率と1対1対応しないため余裕を持たせた目安）。正答率の低い分野のタスクをガイドで復習しましょう。"}));
  const wrong=DATA.items.filter(it=>st.checked[it.id]&&!isCorrect(it)).map(it=>`Q${it.id}(タスク${it.task})`);
  if(wrong.length) r.append(el("p",{text:"復習する問題："+wrong.join("、")}));
  r.scrollIntoView({behavior:"smooth"});
}
function tick(){ const tEl=document.getElementById("timer"); if(!st.start){tEl.textContent="経過 00:00 / 目標 "+DATA.targetMin+"分";return;} const s=Math.floor((Date.now()-st.start)/1000); const m=String(Math.floor(s/60)).padStart(2,"0"), ss=String(s%60).padStart(2,"0"); tEl.textContent=`経過 ${m}:${ss} / 目標 ${DATA.targetMin}分`; }
document.getElementById("btnResult").addEventListener("click",showResult);
document.getElementById("btnReset").addEventListener("click",()=>{ if(!confirm("すべての解答と進捗を消去します。よろしいですか？")) return; st={sel:{},checked:{},start:null}; save(); document.getElementById("result").hidden=true; render(); tick(); });
render(); tick(); setInterval(tick,1000);
window.__ccarf={DATA,get st(){return st},isCorrect,scores};
</script>
</body>
</html>
